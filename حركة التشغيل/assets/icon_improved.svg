<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0" x2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect x="16" y="16" width="480" height="480" rx="64" fill="#071029"/>

  <!-- Paper / document -->
  <g transform="translate(110,90)" filter="url(#shadow)">
    <path d="M0 0h292v332a24 24 0 0 1-24 24H24a24 24 0 0 1-24-24V0z" fill="#ffffff"/>
    <path d="M292 0v72h72" fill="none" stroke="#e6eef8" stroke-width="12" stroke-linecap="round"/>
    <rect x="36" y="96" width="220" height="18" rx="8" fill="#eef6ff"/>
    <rect x="36" y="146" width="180" height="18" rx="8" fill="#eef6ff"/>
  </g>

  <!-- Stylized circular arrows (workflow) -->
  <g transform="translate(256,270)">
    <path d="M120 0a120 120 0 1 1-18.3-64.5" fill="none" stroke="url(#grad)" stroke-width="20" stroke-linecap="round"/>
    <path d="M130 6 l22 -22 l-36 -6 z" fill="url(#grad)" transform="rotate(30 0 0) translate(84 -8)"/>
  </g>

  <!-- Gear / operations icon (simpler, modern) -->
  <g transform="translate(364,360) scale(0.9)">
    <circle cx="0" cy="0" r="34" fill="#071029" stroke="url(#grad)" stroke-width="8"/>
    <g fill="url(#grad)">
      <rect x="-6" y="-46" width="12" height="20" rx="4"/>
      <rect x="-6" y="26" width="12" height="20" rx="4"/>
      <rect x="-46" y="-6" width="20" height="12" rx="4"/>
      <rect x="26" y="-6" width="20" height="12" rx="4"/>
    </g>
    <circle cx="0" cy="0" r="12" fill="#071029" stroke="url(#grad)" stroke-width="6"/>
  </g>

</svg>
