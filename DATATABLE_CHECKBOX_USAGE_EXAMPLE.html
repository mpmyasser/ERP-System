<!-- مثال على كيفية استخدام نظام الحفاظ على checkboxes في DataTables -->

<!-- 1. إضافة checkbox في الجدول -->
<table id="my-table" class="table datatable">
    <thead>
        <tr>
            <th>
                <input type="checkbox" id="select-all" title="تحديد الكل">
            </th>
            <th>الكود</th>
            <th>الاسم</th>
            <th>القسم</th>
        </tr>
    </thead>
    <tbody>
        {% for item in items %}
        <tr data-id="{{ item.id }}">
            <td>
                <input type="checkbox" class="row-checkbox">
            </td>
            <td>{{ item.code }}</td>
            <td>{{ item.name }}</td>
            <td>{{ item.department }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<!-- 2. أزرار التحكم -->
<div class="mt-3">
    <button type="button" class="btn btn-primary" onclick="processSelected()">
        معالجة المحدد (<span id="selected-count">0</span>)
    </button>
    <button type="button" class="btn btn-secondary" onclick="clearAllSelections()">
        مسح التحديدات
    </button>
</div>

<!-- 3. JavaScript للتهيئة -->
<script>
$(document).ready(function() {
    // تهيئة DataTable
    const table = $('#my-table').DataTable({
        // إعدادات DataTable العادية
        pageLength: 25,
        stateSave: true,
        // ... باقي الإعدادات
    });

    // تهيئة نظام checkbox persistence
    initCheckboxPersistence(
        'my-table',              // معرف الجدول
        '.row-checkbox',         // محدد checkbox
        function(row) {          // دالة استخراج ID
            return $(row).data('id');
        }
    );

    // تحديد الكل في الصفحة الحالية
    $('#select-all').on('change', function() {
        if (this.checked) {
            selectAllCurrentPage('my-table', '.row-checkbox', function(row) {
                return $(row).data('id');
            });
        } else {
            // إلغاء تحديد الصفحة الحالية فقط
            table.rows({page: 'current'}).every(function() {
                $(this.node()).find('.row-checkbox').prop('checked', false).trigger('change');
            });
        }
    });

    // تحديث عداد المحدد
    function updateCount() {
        const count = getSelectedIds('my-table').length;
        $('#selected-count').text(count);
    }

    // تحديث العداد عند كل تغيير
    $('#my-table').on('change', '.row-checkbox', updateCount);
    table.on('draw.dt', updateCount);
    updateCount(); // تحديث أولي
});

// معالجة العناصر المحددة
function processSelected() {
    const selectedIds = getSelectedIds('my-table');
    
    if (selectedIds.length === 0) {
        alert('لم يتم تحديد أي عناصر');
        return;
    }

    console.log('IDs المحددة:', selectedIds);
    
    // مثال: إرسال إلى الخادم
    fetch('/api/process', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': '{{ csrf_token() }}'
        },
        body: JSON.stringify({ ids: selectedIds })
    })
    .then(response => response.json())
    .then(data => {
        alert('تمت المعالجة بنجاح');
        clearSelectedIds('my-table');
    })
    .catch(error => {
        console.error('خطأ:', error);
        alert('حدث خطأ أثناء المعالجة');
    });
}

// مسح جميع التحديدات
function clearAllSelections() {
    if (confirm('هل تريد مسح جميع التحديدات؟')) {
        clearSelectedIds('my-table');
        $('#selected-count').text('0');
    }
}
</script>

<!-- 
===========================================
الدوال المتاحة:
===========================================

1. initCheckboxPersistence(tableId, checkboxSelector, getIdCallback)
   - تهيئة النظام للجدول
   - tableId: معرف الجدول (بدون #)
   - checkboxSelector: محدد checkbox (مثل: '.row-checkbox')
   - getIdCallback: دالة لاستخراج ID من الصف

2. getSelectedIds(tableId)
   - الحصول على مصفوفة IDs المحددة
   - يعيد: Array من IDs

3. clearSelectedIds(tableId)
   - مسح جميع التحديدات
   - يحذف من الذاكرة و localStorage

4. selectAllCurrentPage(tableId, checkboxSelector, getIdCallback)
   - تحديد جميع العناصر في الصفحة الحالية
   - نفس المعاملات مثل initCheckboxPersistence

===========================================
ملاحظات مهمة:
===========================================

✅ يعمل مع stateSave: true
✅ يحفظ التحديدات في localStorage
✅ يعمل عبر الصفحات والبحث والفلترة
✅ لا يؤثر على وظائف DataTables الأخرى
✅ يدعم تحديد الكل في الصفحة الحالية
✅ خفيف وسريع (يستخدم Set للأداء)

❌ لا يدعم تحديد الكل في جميع الصفحات (يجب تنفيذه من الخادم)
❌ يجب أن يكون لكل صف data-id أو طريقة لاستخراج ID

===========================================
-->
