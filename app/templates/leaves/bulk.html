{% extends "base.html" %}

{% block title %}إدخال إجازات جماعي{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header bg-success text-white d-flex justify-content-between align-items-center">
        <h4 class="mb-0"><i class="fas fa-umbrella-beach me-2"></i> إدخال إجازات جماعي (Bulk Entry)</h4>
        <div>
            <a href="{{ url_for('leaves.balances') }}" class="btn btn-light btn-sm me-2">
                <i class="fas fa-chart-pie me-1"></i> الأرصدة
            </a>
            <a href="{{ url_for('leaves.list') }}" class="btn btn-light btn-sm text-success fw-bold">
                <i class="fas fa-list me-1"></i> قائمة الإجازات
            </a>
        </div>
    </div>
    <div class="card-body">

        <!-- Batch Settings -->
        <div class="row mb-4 p-3 bg-light border rounded">
            <div class="col-md-12 mb-2"><strong><i class="fas fa-cogs me-1"></i> إعدادات الدفعة (افتراضيات)</strong>
            </div>
            <div class="col-md-3">
                <label class="form-label">تاريخ بداية الإجازة</label>
                <input type="text" id="batchStartDate" class="form-control date-string allow-month-end" value="{{ today }}"
                    placeholder="DD/MM/YYYY">
            </div>
            <div class="col-md-3">
                <label class="form-label">تاريخ نهاية الإجازة</label>
                <input type="text" id="batchEndDate" class="form-control date-string allow-month-end" value="{{ today }}"
                    placeholder="DD/MM/YYYY">
            </div>
            <div class="col-md-3">
                <label class="form-label">نوع الإجازة الافتراضي</label>
                <select id="batchLeaveType" class="form-select">
                    {% for lt in leave_types %}
                    <option value="{{ lt.value }}" {% if lt.value=='سنوية' %}selected{% endif %}>{{ lt.value }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">عدد الأيام الافتراضي</label>
                <input type="number" id="batchDays" class="form-control" value="1" min="0.5" step="0.5">
            </div>
        </div>

        <!-- The Grid -->
        <div class="table-responsive">
            <table class="table table-bordered table-striped" id="bulkTable">
                <thead class="table-dark text-center">
                    <tr>
                        <th width="5%">#</th>
                        <th width="12%">كود الموظف</th>
                        <th width="20%">الاسم</th>
                        <th width="12%">نوع الإجازة</th>
                        <th width="13%">من تاريخ</th>
                        <th width="13%">إلى تاريخ</th>
                        <th width="8%">عدد الأيام</th>
                        <th width="12%">السبب</th>
                        <th width="5%">حذف</th>
                    </tr>
                </thead>
                <tbody id="bulkBody">
                    <!-- Rows generated by JS -->
                </tbody>
            </table>
        </div>

        <div class="d-flex justify-content-end mt-3">
            <button class="btn btn-success btn-lg" onclick="saveAll()">
                <i class="fas fa-save me-1"></i> حفظ الكل
            </button>
        </div>
    </div>
</div>

<script>
    // Initialize
    document.addEventListener('DOMContentLoaded', function () {
        loadSettings();
        addNewRow();

        // Save settings on change
        document.getElementById('batchStartDate').addEventListener('change', saveSettings);
        document.getElementById('batchEndDate').addEventListener('change', saveSettings);
        document.getElementById('batchLeaveType').addEventListener('change', saveSettings);
        document.getElementById('batchDays').addEventListener('change', saveSettings);
    });


    function saveSettings() {
        const settings = {
            startDate: document.getElementById('batchStartDate').value,
            endDate: document.getElementById('batchEndDate').value,
            leaveType: document.getElementById('batchLeaveType').value,
            days: document.getElementById('batchDays').value
        };

        window.HRSettingsUtil.setObject('leaves_bulk_settings', settings);
    }

    function loadSettings() {
        const settings = window.HRSettingsUtil.getObject('leaves_bulk_settings', null);
        if (settings) {
            if (settings.startDate) document.getElementById('batchStartDate').value = settings.startDate;
            if (settings.endDate) document.getElementById('batchEndDate').value = settings.endDate;
            if (settings.leaveType) document.getElementById('batchLeaveType').value = settings.leaveType;
            if (settings.days) document.getElementById('batchDays').value = settings.days;
        }
    }

    function addNewRow() {
        const tbody = document.getElementById('bulkBody');
        const count = tbody.children.length;
        const rowId = count;

        const batchStartDate = document.getElementById('batchStartDate').value;
        const batchEndDate = document.getElementById('batchEndDate').value;
        const batchLeaveType = document.getElementById('batchLeaveType').value;
        const batchDays = document.getElementById('batchDays').value;

        const row = document.createElement('tr');
        row.innerHTML = `
            <td class="text-center align-middle">${count + 1}</td>
            <td>
                <input type="text" class="form-control form-control-sm emp-code" 
                       onchange="fetchName(this, ${rowId})" 
                       onkeydown="handleEnter(event, this, 'leave-type', ${rowId})"
                       placeholder="الكود وانتر" autofocus>
                <input type="hidden" class="emp-id">
            </td>
            <td>
                <input type="text" class="form-control form-control-sm bg-light emp-name" readonly tabindex="-1">
            </td>
            <td>
                <select class="form-select form-select-sm leave-type" onkeydown="handleEnter(event, this, 'start-date', ${rowId})">
                    {% for lt in leave_types %}
                    <option value="{{ lt.value }}">{{ lt.value }}</option>
                    {% endfor %}
                </select>
            </td>
            <td>
                <input type="text" class="form-control form-control-sm date-string allow-month-end start-date" value="${batchStartDate}"
                       placeholder="DD/MM/YYYY" onchange="calculateDays(${rowId});" onkeydown="handleEnter(event, this, 'end-date', ${rowId})">
            </td>
            <td>
                <input type="text" class="form-control form-control-sm date-string allow-month-end end-date" value="${batchEndDate}"
                       placeholder="DD/MM/YYYY" onchange="calculateDays(${rowId})" onkeydown="handleEnter(event, this, 'days-count', ${rowId})">
            </td>
            <td>
                <input type="number" class="form-control form-control-sm days-count" value="${batchDays}" min="0.5" step="0.5"
                       onkeydown="handleEnter(event, this, 'reason', ${rowId})">
            </td>
            <td>
                <input type="text" class="form-control form-control-sm reason" placeholder="اختياري"
                       onkeydown="handleLastEnter(event, ${rowId})">
            </td>
            <td class="text-center">
                <button class="btn btn-sm btn-danger" onclick="this.closest('tr').remove(); updateRowNumbers();" tabindex="-1">
                    <i class="fas fa-times"></i>
                </button>
            </td>
        `;
        tbody.appendChild(row);

        // Set leave type
        row.querySelector('.leave-type').value = batchLeaveType;

        setTimeout(() => row.querySelector('.emp-code').focus(), 50);
    }

    function handleEnter(e, current, nextClass, rowId) {
        if (e.key === 'Enter') {
            e.preventDefault();
            const row = current.closest('tr');

            if (!current.value || (current.value.trim && !current.value.trim())) {
                current.classList.add('is-invalid');
                current.focus();
                return;
            }

            current.classList.remove('is-invalid');
            current.classList.add('is-valid');

            const nextInput = row.querySelector('.' + nextClass);
            if (nextInput) nextInput.focus();
        }
    }

    function handleLastEnter(e, rowId) {
        if (e.key === 'Enter') {
            e.preventDefault();
            const currentRow = e.target.closest('tr');

            const empId = currentRow.querySelector('.emp-id').value;
            const startDate = currentRow.querySelector('.start-date').value;
            const endDate = currentRow.querySelector('.end-date').value;

            if (!empId) {
                alert('يرجى اختيار موظف أولاً');
                currentRow.querySelector('.emp-code').focus();
                return;
            }

            if (!startDate || !endDate) {
                alert('يرجى إدخال تواريخ الإجازة');
                currentRow.querySelector('.start-date').focus();
                return;
            }

            e.target.classList.remove('is-invalid');
            e.target.classList.add('is-valid');

            const tbody = document.getElementById('bulkBody');
            const isLastRow = currentRow === tbody.lastElementChild;

            if (isLastRow) {
                addNewRow();
            } else {
                const nextRow = currentRow.nextElementSibling;
                if (nextRow) {
                    nextRow.querySelector('.emp-code').focus();
                }
            }
        }
    }

    function fetchName(input, rowId) {
        const code = input.value.trim();
        const row = input.closest('tr');
        const nameInput = row.querySelector('.emp-name');
        const idInput = row.querySelector('.emp-id');

        if (!code) {
            nameInput.value = '';
            idInput.value = '';
            return;
        }


        fetch(`/employees/check_code/${code}`)
            .then(res => res.json())
            .then(data => {
                if (data.found) {
                    nameInput.value = data.name;
                    idInput.value = data.id;
                    
                    nameInput.classList.add('is-valid');
                    nameInput.classList.remove('is-invalid');
                    input.classList.remove('is-invalid');
                    input.classList.add('is-valid');
                    row.querySelector('.leave-type').focus();
                } else {
                    nameInput.value = 'غير موجود أو لا يعمل';
                    idInput.value = '';
                    nameInput.classList.add('is-invalid');
                    nameInput.classList.remove('is-valid');
                    input.select();
                }
            })
            .catch(err => console.error(err));
    }


    function calculateDays(rowId) {
        const row = document.querySelector(`#bulkBody tr:nth-child(${rowId + 1})`);
        if (!row) return;

        const startDate = row.querySelector('.start-date').value;
        const endDate = row.querySelector('.end-date').value;
        const daysInput = row.querySelector('.days-count');

        if (startDate && endDate) {
            try {
                const start = parseDateDDMMYYYY(startDate);
                const end = parseDateDDMMYYYY(endDate);
                const days = Math.ceil((end - start) / (1000 * 60 * 60 * 24)) + 1;
                if (days > 0) {
                    daysInput.value = days;
                }
            } catch (e) {
                console.error('Error calculating days:', e);
            }
        }
    }

    function parseDateDDMMYYYY(dateStr) {
        const parts = dateStr.split('/');
        return new Date(parts[2], parts[1] - 1, parts[0]);
    }

    function updateRowNumbers() {
        const tbody = document.getElementById('bulkBody');
        Array.from(tbody.children).forEach((row, idx) => {
            row.children[0].textContent = idx + 1;
        });
    }

    function saveAll() {
        const rows = document.querySelectorAll('#bulkBody tr');
        const payload = [];
        let hasErrors = false;

        rows.forEach(row => {
            const empId = row.querySelector('.emp-id').value;
            const empCode = row.querySelector('.emp-code').value;
            const leaveType = row.querySelector('.leave-type').value;
            const startDate = row.querySelector('.start-date').value;
            const endDate = row.querySelector('.end-date').value;
            const days = row.querySelector('.days-count').value;
            const reason = row.querySelector('.reason').value;

            // Check if row has error classes
            if (row.querySelector('.is-invalid')) {
                hasErrors = true;
            }

            if (empId && startDate && endDate && !row.querySelector('.is-invalid')) {
                payload.push({
                    employee_code: empCode,
                    leave_type: leaveType,
                    start_date: startDate,
                    end_date: endDate,
                    days_count: parseFloat(days) || 1,
                    is_paid: leaveType !== 'بدون راتب',
                    reason: reason
                });
            } else if (empCode && !empId) {
                row.querySelector('.emp-code').classList.add('is-invalid');
                hasErrors = true;
            }
        });

        if (hasErrors) {
            alert('يرجى تصحيح الأكواد الخاطئة');
            return;
        }

        if (payload.length === 0) {
            alert('لا توجد بيانات للحفظ');
            return;
        }

        if (!confirm(`سيتم حفظ ${payload.length} إجازة. هل أنت متأكد؟`)) return;

        fetch('{{ url_for("leaves.bulk") }}', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token() }}'
            },
            body: JSON.stringify({ entries: payload })
        })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    alert(data.message || 'تم الحفظ بنجاح!');
                    window.location.href = "{{ url_for('leaves.list') }}";
                } else {
                    alert('خطأ: ' + data.message + '\n' + (data.errors || []).join('\n'));
                }
            })
            .catch(err => {
                alert('حدث خطأ في الاتصال');
                console.error(err);
            });
    }
</script>
{% endblock %}
