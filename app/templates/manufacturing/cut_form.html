{% extends "base.html" %}

{% block content %}
<div class="row mb-3">
    <div class="col-md-12">
        <h3>فتح أمر قص جديد (يومية القص)</h3>
    </div>
</div>

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm border-0">
            <div class="card-body">
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">رقم القصة (Cut Number)</label>
                            <input type="text" name="cut_number" class="form-control" required
                                placeholder="مثلاً: Cut-2026-001">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">المصنع / الورشة</label>
                            <select name="factory_id" id="factory_id" class="form-select select2" required>
                                <option value="">اختر المصنع...</option>
                                {% for f in factories %}
                                <option value="{{ f.id }}">{{ f.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">المنتج المستهدف</label>
                            <select name="product_id" id="product_id" class="form-select select2" required>
                                <option value="">اختر المنتج...</option>
                                {% for p in products %}
                                <option value="{{ p.id }}">{{ p.code }} - {{ p.name }} ({{ p.size or '' }})</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">تاريخ البدء</label>
                            <input type="date" name="start_date" class="form-control"
                                value="{{ datetime.now().strftime('%Y-%m-%d') }}">
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label class="form-label fw-bold">الكمية (دستة/قطعة)</label>
                            <input type="number" step="0.01" name="planned_quantity" id="planned_quantity"
                                class="form-control" value="0.00" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">سعر الوحدة للمصنع</label>
                            <input type="number" step="0.01" name="unit_cost" id="unit_cost" class="form-control"
                                value="0.00" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">إجمالي القيمة</label>
                            <input type="number" id="total_value" class="form-control bg-light" value="0.00" readonly>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">ملاحظات إضافية</label>
                        <textarea name="notes" class="form-control" rows="2"
                            placeholder="أي تفاصيل عن القصة..."></textarea>
                    </div>

                    <div class="text-center">
                        <button type="submit" class="btn btn-primary btn-lg px-5">
                            <i class="fas fa-save me-1"></i> فتح أمر القص
                        </button>
                        <a href="{{ url_for('manufacturing.list_cuts') }}"
                            class="btn btn-outline-secondary btn-lg">إلغاء</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const factorySelect = document.getElementById('factory_id');
        const productSelect = document.getElementById('product_id');
        const unitCostInput = document.getElementById('unit_cost');
        const qtyInput = document.getElementById('planned_quantity');
        const totalInput = document.getElementById('total_value');

        function fetchLastPrice() {
            const factoryId = factorySelect.value;
            const productId = productSelect.value;

            if (factoryId && productId) {
                fetch(`/manufacturing/api/last_price?factory_id=${factoryId}&product_id=${productId}`)
                    .then(res => res.json())
                    .then(data => {
                        if (data.price > 0) {
                            unitCostInput.value = data.price;
                            updateTotal();
                        }
                    });
            }
        }

        function updateTotal() {
            const qty = parseFloat(qtyInput.value) || 0;
            const price = parseFloat(unitCostInput.value) || 0;
            totalInput.value = (qty * price).toFixed(2);
        }

        factorySelect.addEventListener('change', fetchLastPrice);
        productSelect.addEventListener('change', fetchLastPrice);
        unitCostInput.addEventListener('input', updateTotal);
        qtyInput.addEventListener('input', updateTotal);
    });
</script>
{% endblock %}
