{% extends "base.html" %}

{% block content %}
<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="h3 mb-0 text-gray-800"><i class="fas fa-layer-group me-2"></i>إدخال يومية قص جماعي</h2>
        <a href="{{ url_for('manufacturing.list_cuts') }}" class="btn btn-outline-secondary">
            <i class="fas fa-arrow-left me-1"></i> العودة للقائمة
        </a>
    </div>

    <form method="POST" id="bulkForm">
        <div class="card shadow mb-4">
            <div class="card-header py-3 d-flex justify-content-between align-items-center bg-light">
                <h6 class="m-0 font-weight-bold text-primary">بيانات القيمة الجماعية</h6>
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="is_opening" name="is_opening" value="true">
                    <label class="form-check-label" for="is_opening">رصيد أول مدة</label>
                </div>
            </div>
            <div class="card-body">
                <div class="row mb-4">
                    <div class="col-md-4">
                        <label class="form-label">المصنع / الورشة</label>
                        <select name="factory_id" id="factory_id" class="form-select select2" required>
                            <option value="">اختر المصنع...</option>
                            {% for f in factories %}
                            <option value="{{ f.id }}">{{ f.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table table-bordered align-middle" id="itemsTable">
                        <thead class="table-light">
                            <tr>
                                <th style="width: 200px;">كود الصنف</th>
                                <th>اسم الصنف / المقاس</th>
                                <th style="width: 120px;">الكمية</th>
                                <th style="width: 150px;">سعر الوحدة</th>
                                <th style="width: 150px;">الإجمالي</th>
                                <th style="width: 180px;">التاريخ</th>
                                <th style="width: 50px;"></th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Rows will be added here -->
                        </tbody>
                        <tfoot>
                            <tr>
                                <td colspan="2" class="text-end fw-bold">الإجمالي الكلي:</td>
                                <td id="totalQty" class="fw-bold text-primary">0</td>
                                <td></td>
                                <td id="totalAmount" class="fw-bold text-success">0.00</td>
                                <td colspan="2"></td>
                            </tr>
                        </tfoot>
                    </table>
                </div>

                <div class="mt-3">
                    <button type="button" class="btn btn-outline-primary btn-sm" onclick="addRow()">
                        <i class="fas fa-plus me-1"></i> إضافة سطر جديد
                    </button>
                    <button type="button" class="btn btn-outline-info btn-sm" onclick="addTenRows()">
                        <i class="fas fa-plus-circle me-1"></i> إضافة 10 أسطر
                    </button>
                </div>
            </div>
            <div class="card-footer text-end bg-light py-3">
                <button type="submit" class="btn btn-primary px-5 btn-lg shadow-sm">
                    <i class="fas fa-save me-2"></i> حفظ الكل
                </button>
            </div>
        </div>
    </form>
</div>

<!-- Row Template (Hidden) -->
<template id="rowTemplate">
    <tr>
        <td>
            <input type="text" name="code[]" class="form-control code-input" placeholder="ادخل الكود..." required>
            <input type="hidden" name="product_id[]" class="product-id">
        </td>
        <td>
            <div class="product-info text-muted small">---</div>
        </td>
        <td>
            <input type="number" name="quantity[]" class="form-control qty-input" step="0.01" min="0" required>
        </td>
        <td>
            <input type="number" name="price[]" class="form-control price-input" step="0.01" min="0" required>
        </td>
        <td>
            <div class="row-total text-dark">0.00</div>
        </td>
        <td>
            <input type="date" name="date[]" class="form-control" value="{{ now.strftime('%Y-%m-%d') }}">
        </td>
        <td class="text-center">
            <button type="button" class="btn btn-link text-danger p-0" onclick="removeRow(this)">
                <i class="fas fa-times"></i>
            </button>
        </td>
    </tr>
</template>

<style>
    .code-input {
        font-family: monospace;
        font-weight: bold;
    }

    #itemsTable input {
        border-radius: 4px;
        border: 1px solid #ddd;
    }

    #itemsTable input:focus {
        border-color: #4e73df;
        box-shadow: none;
    }

    .product-info {
        min-height: 24px;
    }
</style>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        // Add initial rows
        for (let i = 0; i < 3; i++) addRow();

        // Global delegation for inputs
        document.getElementById('itemsTable').addEventListener('input', function (e) {
            if (e.target.classList.contains('code-input')) {
                handleCodeLookup(e.target);
            }
            if (e.target.classList.contains('qty-input') || e.target.classList.contains('price-input')) {
                updateTotals();
            }
        });

        document.getElementById('factory_id').addEventListener('change', function () {
            // When factory changes, refresh prices for existing codes
            document.querySelectorAll('.code-input').forEach(input => {
                if (input.value) handleCodeLookup(input);
            });
        });
    });

    function addRow() {
        const table = document.querySelector('#itemsTable tbody');
        const template = document.querySelector('#rowTemplate');
        const clone = template.content.cloneNode(true);

        // Set default date to today
        const dateInput = clone.querySelector('input[type="date"]');
        const today = new Date().toISOString().split('T')[0];
        dateInput.value = today;

        table.appendChild(clone);
    }

    function addTenRows() {
        for (let i = 0; i < 10; i++) addRow();
    }

    function removeRow(btn) {
        const row = btn.closest('tr');
        if (document.querySelectorAll('#itemsTable tbody tr').length > 1) {
            row.remove();
            updateTotals();
        }
    }

    function handleCodeLookup(input) {
        const code = input.value.trim();
        const row = input.closest('tr');
        const infoDiv = row.querySelector('.product-info');
        const idInput = row.querySelector('.product-id');
        const priceInput = row.querySelector('.price-input');
        const factoryId = document.getElementById('factory_id').value;

        if (!code) {
            infoDiv.textContent = '---';
            idInput.value = '';
            return;
        }

        // Lookup product
        fetch(`/manufacturing/products/check_code/${encodeURIComponent(code)}`)
            .then(res => res.json())
            .then(data => {
                if (data.found) {
                    infoDiv.textContent = `${data.name} | ${data.size || ''}`;
                    infoDiv.classList.remove('text-danger');
                    idInput.value = data.id;

                    // Fetch last price if factory is selected
                    if (factoryId) {
                        fetch(`/manufacturing/api/last_price?factory_id=${factoryId}&product_id=${data.id}`)
                            .then(res => res.json())
                            .then(priceData => {
                                if (priceData.price > 0) {
                                    priceInput.value = priceData.price;
                                    updateTotals();
                                }
                            });
                    }
                } else {
                    infoDiv.textContent = 'الكود غير موجود!';
                    infoDiv.classList.add('text-danger');
                    idInput.value = '';
                }
            });
    }

    function updateTotals() {
        let totalQty = 0;
        let totalAmount = 0;

        document.querySelectorAll('#itemsTable tbody tr').forEach(row => {
            const qty = parseFloat(row.querySelector('.qty-input').value) || 0;
            const price = parseFloat(row.querySelector('.price-input').value) || 0;
            const total = qty * price;

            row.querySelector('.row-total').textContent = total.toLocaleString('en-US', { minimumFractionDigits: 2 });

            totalQty += qty;
            totalAmount += total;
        });

        document.getElementById('totalQty').textContent = totalQty.toLocaleString();
        document.getElementById('totalAmount').textContent = totalAmount.toLocaleString('en-US', { minimumFractionDigits: 2 });
    }
</script>
{% endblock %}
