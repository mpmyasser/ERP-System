{% extends "manufacturing/mfg_base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center mb-5">
            <h1 class="display-4 fw-bold mb-3"><i class="fas fa-file-invoice-dollar me-3 text-primary"></i>تقرير الرسالة التفصيلي</h1>
            <p class="lead text-muted">أدخل رقم الرسالة لعرض كافة التفاصيل الإنتاجية والمحاسبية والمخزنية.</p>
        </div>
        
        <div class="col-md-6">
            <div class="card border-0 shadow-lg p-4" style="border-radius: 20px; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px);">
                <form action="{{ url_for('manufacturing.message_detailed_report_page') }}" method="get">
                    <div class="mb-4">
                        <label for="message_no" class="form-label fs-5 fw-bold mb-3">رقم الرسالة</label>
                        <div class="input-group input-group-lg shadow-sm">
                            <span class="input-group-text bg-white border-end-0"><i class="fas fa-hashtag text-primary"></i></span>
                            <input type="text" id="message_no" name="message_no" class="form-control border-start-0" placeholder="مثال: 512" required autofocus>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100 shadow" style="border-radius: 12px;">
                        <i class="fas fa-search me-2"></i>عرض التقرير التفصيلي
                    </button>
                </form>
            </div>
            
            <div class="mt-5 text-center">
                <div class="d-flex justify-content-center gap-4 text-muted">
                    <span><i class="fas fa-check-circle text-success me-1"></i> تتبع الإنتاج</span>
                    <span><i class="fas fa-check-circle text-success me-1"></i> مراجعة المحاسبة</span>
                    <span><i class="fas fa-check-circle text-success me-1"></i> حركة المخزن</span>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
