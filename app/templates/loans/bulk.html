{% extends "base.html" %}

{% block title %}إدخال سلف جماعي{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
        <h4 class="mb-0"><i class="fas fa-layer-group me-2"></i> إدخال سلف جماعي (Bulk Entry)</h4>
        <a href="{{ url_for('loans.list') }}" class="btn btn-light btn-sm text-primary fw-bold">
            <i class="fas fa-list me-1"></i> قائمة السلف
        </a>
    </div>
    <div class="card-body">

        <!-- Batch Settings -->
        <div class="row mb-4 p-3 bg-light border rounded">
            <div class="col-md-12 mb-2"><strong><i class="fas fa-cogs me-1"></i> إعدادات الدفعة (افتراضيات)</strong>
            </div>
            <div class="col-md-3">
                <label class="form-label">تاريخ السلف الموحد</label>
                <input type="text" id="batchDate" class="form-control date-string allow-month-end" value="{{ today }}"
                    placeholder="DD/MM/YYYY">
            </div>
            <div class="col-md-3">
                <label class="form-label">نوع السلفة الافتراضي</label>
                <select id="batchType" class="form-select" disabled>
                    <option value="permanent">مستديمة</option>
                    <option value="temporary" selected>مؤقتة</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">عدد الأقساط الافتراضي</label>
                <input type="number" id="batchInstallments" class="form-control" value="1" min="1"
                    onchange="syncBatchType()">
            </div>
            <div class="col-md-3 align-self-end">
                <small class="text-muted">هذه القيم ستملأ الصفوف الجديدة تلقائياً</small>
            </div>
        </div>

        <!-- The Grid -->
        <div class="table-responsive">
            <table class="table table-bordered table-striped" id="bulkTable">
                <thead class="table-dark text-center">
                    <tr>
                        <th width="5%">#</th>
                        <th width="15%">كود الموظف</th>
                        <th width="25%">الاسم</th>
                        <th width="15%">المبلغ</th>
                        <th width="15%">النوع</th>
                        <th width="10%">الأقساط</th>
                        <th width="15%">شهر الاستثناء</th>
                        <th width="10%">حذف</th>
                    </tr>
                </thead>
                <tbody id="bulkBody">
                    <!-- Rows generated by JS -->
                </tbody>
            </table>
        </div>

        <div class="d-flex justify-content-end mt-3">
            <button class="btn btn-success btn-lg" onclick="saveAll()">
                <i class="fas fa-save me-1"></i> حفظ الكل
            </button>
        </div>
    </div>
</div>

<script>
    // Initialize
    document.addEventListener('DOMContentLoaded', function () {
        addNewRow(); // Start with one row
        
        // Re-check all rows if date changes
        document.getElementById('batchDate').addEventListener('change', function() {
            const rows = document.querySelectorAll('#bulkBody tr');
            rows.forEach(row => {
                const empCodeInput = row.querySelector('.emp-code');
                if (empCodeInput.value) {
                    fetchName(empCodeInput, null, false); 
                }
            });
        });
    });

    function addNewRow() {
        const tbody = document.getElementById('bulkBody');
        const count = tbody.children.length;
        const rowId = count;

        const batchDate = document.getElementById('batchDate').value; // Not used in row UI anymore to save space, but used in payload
        const batchType = document.getElementById('batchType').value;
        const batchInst = document.getElementById('batchInstallments').value;

        const row = document.createElement('tr');
        row.innerHTML = `
            <td class="text-center align-middle">${count + 1}</td>
            <td>
                <input type="text" class="form-control emp-code" 
                       onchange="fetchName(this, ${rowId})" 
                       onkeydown="handleEnter(event, this, 'amount', ${rowId})"
                       placeholder="الكود وانتر" autofocus>
                <input type="hidden" class="emp-id">
            </td>
            <td>
                <input type="text" class="form-control bg-light emp-name" readonly tabindex="-1">
            </td>
            <td>
                <input type="number" class="form-control amount" step="0.01"
                       onkeydown="handleEnter(event, this, 'inst', ${rowId})">
            </td>
            <td>
                <select class="form-select type" disabled>
                    <option value="permanent" ${batchType === 'permanent' ? 'selected' : ''}>مستديمة</option>
                    <option value="temporary" ${batchType === 'temporary' ? 'selected' : ''}>مؤقتة</option>
                </select>
            </td>
            <td>
                <input type="number" class="form-control inst" value="${batchInst}" min="1"
                       onchange="syncRowType(this)"
                       onkeydown="handleEnter(event, this, 'excluded-month-select', ${rowId})">
            </td>
            <td>
                <input type="hidden" class="excluded-months-hidden" value="">
                <div class="excluded-months-builder"></div>
            </td>
            <td class="text-center">
                <button class="btn btn-danger btn-sm" onclick="this.closest('tr').remove(); updateRowNumbers();" tabindex="-1">
                    <i class="fas fa-times"></i>
                </button>
            </td>
        `;
        tbody.appendChild(row);
        initExcludedMonthsBuilder(row);

        // Focus the code input of new row
        setTimeout(() => row.querySelector('.emp-code').focus(), 50);
    }

    function updateRowNumbers() {
        const tbody = document.getElementById('bulkBody');
        Array.from(tbody.children).forEach((row, idx) => {
            row.children[0].textContent = idx + 1;
        });
    }

    function syncBatchType() {
        const inst = parseInt(document.getElementById('batchInstallments').value);
        const typeSelect = document.getElementById('batchType');
        if (inst === 1) {
            typeSelect.value = 'temporary';
        } else if (inst > 1) {
            typeSelect.value = 'permanent';
        }
    }

    function syncRowType(input) {
        const row = input.closest('tr');
        const inst = parseInt(input.value);
        const typeSelect = row.querySelector('.type');
        if (inst === 1) {
            typeSelect.value = 'temporary';
        } else if (inst > 1) {
            typeSelect.value = 'permanent';
        }
    }


    const excludedMonthOptions = [
        { value: '1', label: 'يناير' },
        { value: '2', label: 'فبراير' },
        { value: '3', label: 'مارس' },
        { value: '4', label: 'أبريل' },
        { value: '5', label: 'مايو' },
        { value: '6', label: 'يونيو' },
        { value: '7', label: 'يوليو' },
        { value: '8', label: 'أغسطس' },
        { value: '9', label: 'سبتمبر' },
        { value: '10', label: 'أكتوبر' },
        { value: '11', label: 'نوفمبر' },
        { value: '12', label: 'ديسمبر' }
    ];

    const excludedMonthOptionsHtml = ['<option value="">-- اختر شهر --</option>'].concat(
        excludedMonthOptions.map(m => `<option value="${m.value}">${m.label}</option>`)
    ).join('');

    function initExcludedMonthsBuilder(row, initialValue = '') {
        const hiddenInput = row.querySelector('.excluded-months-hidden');
        const container = row.querySelector('.excluded-months-builder');
        if (!hiddenInput || !container) return;

        function parseInitialValues(raw) {
            const values = [];
            (raw || '').split(',').forEach(token => {
                const n = parseInt((token || '').trim(), 10);
                if (!Number.isNaN(n) && n >= 1 && n <= 12) {
                    const v = String(n);
                    if (!values.includes(v)) values.push(v);
                }
            });
            return values;
        }

        function getRows() {
            return Array.from(container.querySelectorAll('.excluded-month-row'));
        }

        function getSelects() {
            return getRows().map(r => r.querySelector('select')).filter(Boolean);
        }

        function getSelectedValues() {
            return getSelects().map(s => s.value).filter(Boolean);
        }

        function syncHiddenInput() {
            hiddenInput.value = getSelectedValues().join(',');
        }

        function updateRemoveButtons() {
            const rows = getRows();
            rows.forEach(r => {
                const btn = r.querySelector('.remove-month-btn');
                const sel = r.querySelector('select');
                if (!btn || !sel) return;
                btn.disabled = rows.length === 1 && !sel.value;
            });
        }

        function addMonthSelectRow(selectedValue = '') {
            const monthRow = document.createElement('div');
            monthRow.className = 'excluded-month-row d-flex align-items-center gap-1 mb-1';
            monthRow.innerHTML = `
                <select class="form-select form-select-sm excluded-month-select">${excludedMonthOptionsHtml}</select>
                <button type="button" class="btn btn-outline-danger btn-sm remove-month-btn" title="حذف الشهر">
                    <i class="fas fa-times"></i>
                </button>
            `;

            const select = monthRow.querySelector('select');
            const removeBtn = monthRow.querySelector('.remove-month-btn');
            select.value = selectedValue || '';

            select.addEventListener('change', function () {
                if (select.value) {
                    const duplicates = getSelectedValues().filter(v => v === select.value).length;
                    if (duplicates > 1) {
                        alert('تم اختيار هذا الشهر مسبقًا');
                        select.value = '';
                    }
                }
                normalizeRows();
            });

            select.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') {
                    handleLastEnter(e, 0);
                }
            });

            removeBtn.addEventListener('click', function () {
                monthRow.remove();
                if (getRows().length === 0) addMonthSelectRow('');
                normalizeRows();
            });

            container.appendChild(monthRow);
        }

        function normalizeRows() {
            const rows = getRows();
            const emptyRows = rows.filter(r => {
                const s = r.querySelector('select');
                return s && !s.value;
            });

            if (rows.length === 0) {
                addMonthSelectRow('');
            } else if (emptyRows.length === 0) {
                addMonthSelectRow('');
            } else if (emptyRows.length > 1) {
                emptyRows.slice(0, -1).forEach(r => r.remove());
            }

            syncHiddenInput();
            updateRemoveButtons();
        }

        container.innerHTML = '';
        const initialValues = parseInitialValues(initialValue || hiddenInput.value);
        if (initialValues.length > 0) {
            initialValues.forEach(v => addMonthSelectRow(v));
        }
        addMonthSelectRow('');
        normalizeRows();
    }

    // Handle Enter key navigation with validation
    function handleEnter(e, current, nextClass, rowId) {
        if (e.key === 'Enter') {
            e.preventDefault();
            const row = current.closest('tr');
            
            // التحقق من أن الحقل الحالي ممتلئ
            if (!current.value || (current.value.trim && !current.value.trim())) {
                current.classList.add('is-invalid');
                current.focus();
                return;
            }
            
            current.classList.remove('is-invalid');
            current.classList.add('is-valid');
            
            const nextInput = row.querySelector('.' + nextClass);
            if (nextInput) nextInput.focus();
        }
    }

    function handleLastEnter(e, rowId) {
        if (e.key === 'Enter') {
            e.preventDefault();
            const currentRow = e.target.closest('tr');
            
            // التحقق من أن جميع الحقول المطلوبة ممتلئة
            const empId = currentRow.querySelector('.emp-id').value;
            const amount = currentRow.querySelector('.amount').value;
            const inst = currentRow.querySelector('.inst').value;
            
            if (!empId) {
                alert('يرجى اختيار موظف أولاً');
                currentRow.querySelector('.emp-code').focus();
                return;
            }
            
            if (!amount || amount <= 0) {
                alert('يرجى إدخال مبلغ صحيح');
                currentRow.querySelector('.amount').focus();
                return;
            }
            
            if (!inst || inst < 1) {
                alert('يرجى إدخال عدد الأقساط');
                e.target.focus();
                return;
            }
            
            e.target.classList.remove('is-invalid');
            e.target.classList.add('is-valid');
            
            // Always check if this is the last row
            const tbody = document.getElementById('bulkBody');
            const isLastRow = currentRow === tbody.lastElementChild;
            
            if (isLastRow) {
                // Add new row automatically
                addNewRow();
            } else {
                // Move to next row's code field
                const nextRow = currentRow.nextElementSibling;
                if (nextRow) {
                    nextRow.querySelector('.emp-code').focus();
                }
            }
        }
    }

    function fetchName(input, rowId, shouldFocus = true) {
        const code = input.value.trim();
        const row = input.closest('tr');
        const nameInput = row.querySelector('.emp-name');
        const idInput = row.querySelector('.emp-id');

        if (!code) {
            nameInput.value = '';
            idInput.value = '';
            return;
        }

        // Check if code is duplicated in the current grid
        const allCodeInputs = document.querySelectorAll('.emp-code');
        let duplicateInGrid = false;
        allCodeInputs.forEach(otherInput => {
            if (otherInput !== input && otherInput.value.trim() === code && code !== "") {
                duplicateInGrid = true;
            }
        });

        if (duplicateInGrid) {
            alert(`كود الموظف (${code}) مكرر في الجدول!`);
            nameInput.value = 'كود مكرر في الجدول';
            idInput.value = '';
            input.classList.add('is-invalid');
            nameInput.classList.add('is-invalid');
            input.focus();
            return;
        }

        fetch(`/employees/check_code/${code}`)
            .then(res => res.json())
            .then(data => {
                if (data.found) {
                    nameInput.value = data.name;
                    idInput.value = data.id;
                    
                    // Check for duplicate loan on this date
                    const batchDate = document.getElementById('batchDate').value;
                    if (batchDate) {
                        fetch(`/loans/check_duplicate?employee_id=${data.id}&date=${batchDate}`)
                            .then(res => res.json())
                            .then(dupData => {
                                if (dupData.exists) {
                                    nameInput.value = `${data.name} (يوجد سلفة بالفعل لهذا التاريخ!)`;
                                    nameInput.classList.add('is-invalid');
                                    nameInput.classList.remove('is-valid');
                                    input.classList.add('is-invalid');
                                } else {
                                    nameInput.classList.add('is-valid');
                                    nameInput.classList.remove('is-invalid');
                                    input.classList.remove('is-invalid');
                                    input.classList.add('is-valid');
                                }
                            });
                    } else {
                        nameInput.classList.add('is-valid');
                        nameInput.classList.remove('is-invalid');
                    }
                    if (shouldFocus) row.querySelector('.amount').focus();
                } else {
                    nameInput.value = 'غير موجود أو لا يعمل';
                    idInput.value = '';
                    nameInput.classList.add('is-invalid');
                    nameInput.classList.remove('is-valid');
                    input.select();
                }
            })
            .catch(err => console.error(err));
    }

    function validateLoanDate(dateStr) {
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        
        let inputDate = null;
        if (dateStr.includes('/')) {
            const parts = dateStr.split('/');
            if (parts.length === 3) {
                inputDate = new Date(parts[2], parts[1] - 1, parts[0]);
            }
        } else if (dateStr.includes('-')) {
            inputDate = new Date(dateStr);
        }
        
        if (!inputDate) return false;
        
        inputDate.setHours(0, 0, 0, 0);
        
        if (inputDate > today) {
            const lastDayOfMonth = new Date(today.getFullYear(), today.getMonth() + 1, 0);
            if (inputDate > lastDayOfMonth) {
                return false;
            }
        }
        return true;
    }

    function saveAll() {
        const rows = document.querySelectorAll('#bulkBody tr');
        const payload = [];
        const batchDate = document.getElementById('batchDate').value;
        let hasErrors = false;

        if (!validateLoanDate(batchDate)) {
            alert('يجب أن تكون تاريخ السلفة في نهاية هذا الشهر على الأقصى (لا يمكن تجاوز آخر يوم في الشهر الحالي)');
            document.getElementById('batchDate').classList.add('is-invalid');
            document.getElementById('batchDate').focus();
            return;
        }
        
        document.getElementById('batchDate').classList.remove('is-invalid');

        rows.forEach(row => {
            const id = row.querySelector('.emp-id').value;
            const amount = row.querySelector('.amount').value;
            const type = row.querySelector('.type').value;
            const inst = row.querySelector('.inst').value;
            const excludedMonths = (row.querySelector('.excluded-months-hidden')?.value || '').trim();

            if (id && amount) {
                payload.push({
                    employee_id: id,
                    amount: amount,
                    loan_type: type,
                    number_of_installments: inst,
                    excluded_months: excludedMonths || null,
                    date: batchDate
                });
            } else if (row.querySelector('.emp-code').value && !id) {
                row.querySelector('.emp-code').classList.add('is-invalid');
                hasErrors = true;
            }
        });

        if (hasErrors) {
            alert('يرجى تصحيح الأكواد الخاطئة');
            return;
        }

        if (payload.length === 0) {
            alert('لا توجد بيانات للحفظ');
            return;
        }

        if (!confirm(`سيتم حفظ ${payload.length} سلفة. هل أنت متأكد؟`)) return;

        fetch('{{ url_for("loans.bulk_save") }}', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token() }}'
            },
            body: JSON.stringify({ loans: payload })
        })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    alert('تم الحفظ بنجاح!');
                    window.location.href = "{{ url_for('loans.list') }}";
                } else {
                    alert('خطأ: ' + data.message);
                }
            })
            .catch(err => {
                alert('حدث خطأ في الاتصال');
                console.error(err);
            });
    }
</script>
{% endblock %}
