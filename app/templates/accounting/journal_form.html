{% extends "base.html" %}

{% block content %}
<div class="row mb-3">
    <div class="col-md-12">
        <h3>{% if mode == 'edit' %}تعديل قيد يومية #{{ entry.id }}{% else %}إنشاء قيد يومية جديد{% endif %}</h3>
    </div>
</div>

<div class="card shadow-sm border-0">
    <div class="card-body">
        <!-- Header Info -->
        <div class="row mb-4">
            <div class="col-md-3">
                <label class="form-label fw-bold">تاريخ القيد</label>
                <input type="date" id="journal_date" class="form-control"
                    value="{{ entry.date.strftime('%Y-%m-%d') if entry else date.today().strftime('%Y-%m-%d') }}">
            </div>
            <div class="col-md-3">
                <label class="form-label fw-bold">رقم القيد / المرجع</label>
                <input type="text" id="reference" class="form-control" placeholder="اختياري"
                    value="{{ entry.reference or '' }}">
            </div>
            <div class="col-md-6">
                <label class="form-label fw-bold">البيان العام</label>
                <input type="text" id="general_desc" class="form-control" placeholder="وصف عام للقيد"
                    value="{{ entry.description or '' }}">
            </div>
        </div>

        <!-- Bulk Grid -->
        <div class="table-responsive">
            <table class="table table-bordered align-middle" id="journal_table">
                <thead class="bg-light">
                    <tr>
                        <th style="width: 30%;">الحساب</th>
                        <th style="width: 15%;">مدين (Debit)</th>
                        <th style="width: 15%;">دائن (Credit)</th>
                        <th>البيان السفلي</th>
                        <th style="width: 5%;"></th>
                    </tr>
                </thead>
                <tbody id="journal_body">
                    <!-- Rows will be added here -->
                </tbody>
                <tfoot>
                    <tr class="table-secondary fw-bold">
                        <td class="text-start">الإجمالي</td>
                        <td id="total_debit">0.00</td>
                        <td id="total_credit">0.00</td>
                        <td id="balance_status" class="text-danger">غير متوازن (0.00)</td>
                        <td></td>
                    </tr>
                </tfoot>
            </table>
        </div>

        <div class="mt-3">
            <button class="btn btn-outline-secondary btn-sm" onclick="addRow()">
                <i class="fas fa-plus"></i> إضافة سطر (Ins)
            </button>
        </div>

        <hr>

        <div class="row">
            <div class="col-md-12 text-center">
                <button class="btn btn-success btn-lg px-5" onclick="saveJournal()">
                    <i class="fas fa-save"></i> حفظ القيد (F10)
                </button>
                <a href="{{ url_for('accounting.list_journals') }}" class="btn btn-outline-secondary btn-lg">إلغاء</a>
            </div>
        </div>
    </div>
</div>

<!-- Scripts for Bulk Logic -->
<script>
    let rowCount = 0;

    function addRow(initialData = null) {
        rowCount++;
        const tbody = document.getElementById('journal_body');
        const tr = document.createElement('tr');
        tr.id = `row_${rowCount}`;
        tr.innerHTML = `
            <td>
                <select class="form-select account-select" id="acc_${rowCount}" required>
                    <option value="">ابحث عن الحساب...</option>
                </select>
            </td>
            <td>
                <input type="number" step="0.01" class="form-control debit-input text-end" onchange="calculateTotals()" placeholder="0.00" value="${initialData ? initialData.debit : ''}">
            </td>
            <td>
                <input type="number" step="0.01" class="form-control credit-input text-end" onchange="calculateTotals()" placeholder="0.00" value="${initialData ? initialData.credit : ''}">
            </td>
            <td>
                <input type="text" class="form-control item-desc" placeholder="اختياري" value="${initialData ? initialData.description : ''}">
            </td>
            <td class="text-center">
                <button class="btn btn-link text-danger p-0" onclick="removeRow(${rowCount})">
                    <i class="fas fa-trash"></i>
                </button>
            </td>
        `;
        tbody.appendChild(tr);

        // Initialize Select2 on the new row
        initAccountSearch(rowCount, initialData ? initialData.account : null);
        calculateTotals();
    }

    function removeRow(id) {
        if (document.querySelectorAll('#journal_body tr').length > 1) {
            document.getElementById(`row_${id}`).remove();
            calculateTotals();
        }
    }

    function initAccountSearch(id, initialAccount = null) {
        const select = $(`#acc_${id}`);
        select.select2({
            theme: 'bootstrap-5',
            ajax: {
                url: "{{ url_for('accounting.search_accounts') }}",
                dataType: 'json',
                delay: 250,
                data: function (params) {
                    return {
                        q: params.term // search term
                    };
                },
                processResults: function (data) {
                    return {
                        results: data
                    };
                },
                cache: true
            },
            placeholder: 'ابحث عن اسم أو كود الحساب...',
            minimumInputLength: 1,
            language: {
                inputTooShort: function () {
                    return "يرجى إدخال حرف واحد أو أكثر للبحث";
                },
                searching: function () {
                    return "جاري البحث...";
                },
                noResults: function () {
                    return "لا توجد نتائج";
                }
            },
            dir: "rtl"
        });

        if (initialAccount) {
            const option = new Option(`${initialAccount.code} - ${initialAccount.name}`, initialAccount.id, true, true);
            select.append(option).trigger('change');
        }
    }


    function calculateTotals() {
        let debits = 0;
        let credits = 0;

        document.querySelectorAll('.debit-input').forEach(input => {
            debits += parseFloat(input.value || 0);
        });
        document.querySelectorAll('.credit-input').forEach(input => {
            credits += parseFloat(input.value || 0);
        });

        document.getElementById('total_debit').innerText = debits.toFixed(2);
        document.getElementById('total_credit').innerText = credits.toFixed(2);

        const diff = Math.abs(debits - credits);
        const statusBox = document.getElementById('balance_status');

        if (diff < 0.001 && (debits > 0 || credits > 0)) {
            statusBox.innerText = 'متوازن ✓';
            statusBox.className = 'text-success';
        } else {
            statusBox.innerText = `غير متوازن (${diff.toFixed(2)})`;
            statusBox.className = 'text-danger';
        }
    }

    async function saveJournal() {
        const items = [];
        let valid = true;

        document.querySelectorAll('#journal_body tr').forEach(tr => {
            const accId = tr.querySelector('.account-select').value;
            const debit = tr.querySelector('.debit-input').value;
            const credit = tr.querySelector('.credit-input').value;
            const desc = tr.querySelector('.item-desc').value;

            if (!accId && (debit || credit)) valid = false;

            if (debit || credit) {
                items.push({
                    account_id: accId,
                    debit: debit,
                    credit: credit,
                    description: desc
                });
            }
        });

        if (!valid || items.length === 0) {
            alert('يرجى اختيار الحساب لجميع أسطر القيد');
            return;
        }

        const data = {
            id: "{{ entry.id if entry else '' }}",
            date: document.getElementById('journal_date').value,
            reference: document.getElementById('reference').value,
            description: document.getElementById('general_desc').value,
            items: items
        };

        try {
            const response = await fetch("{{ url_for('accounting.save_journal') }}", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": "{{ csrf_token() }}"
                },
                body: JSON.stringify(data)
            });
            const result = await response.json();
            if (result.success) {
                alert('تم الحفظ بنجاح');
                window.location.href = "{{ url_for('accounting.list_journals') }}";
            } else {
                alert('خطأ: ' + result.message);
            }
        } catch (e) {
            alert('حدث خطأ في الاتصال بالسيرفر');
        }
    }

    window.onload = function () {
        {% if mode == 'edit' and entry %}
        {% for item in entry.items %}
        addRow({
            account: { id: {{ item.account.id }}, code: '{{ item.account.code }}', name: '{{ item.account.name }}' },
    debit: { { item.debit } },
    credit: { { item.credit } },
    description: '{{ item.description or "" }}'
                });
    {% endfor %}
    {% else %}
    addRow();
    addRow();
    {% endif %}
    };

    document.addEventListener('keydown', function (e) {
        if (e.key === 'Insert') {
            addRow();
        }
        if (e.key === 'F10') {
            e.preventDefault();
            saveJournal();
        }
    });
</script>


<style>
    .account-select {
        font-size: 0.9rem;
    }

    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
    }
</style>
{% endblock %}
