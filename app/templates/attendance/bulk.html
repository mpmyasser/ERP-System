{% extends "base.html" %}

{% block title %}الإدخال الجماعي للحضور والانصراف{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
        <h4 class="mb-0"><i class="fas fa-layer-group me-2"></i> الإدخال الجماعي للحضور والانصراف</h4>
        <a href="{{ url_for('attendance.daily') }}" class="btn btn-light btn-sm text-primary fw-bold">
            <i class="fas fa-clock me-1"></i> الحضور اليومي
        </a>
    </div>
    <div class="card-body">
        <!-- Batch Settings -->
        <div class="row mb-4 p-3 bg-light border rounded">
            <div class="col-md-12 mb-2"><strong><i class="fas fa-cogs me-1"></i> إعدادات الدفعة (افتراضيات)</strong>
            </div>
            <div class="col-md-4">
                <label class="form-label">تاريخ الحضور الموحد</label>
                <input type="text" id="batchDate" class="form-control date-string" value="{{ today }}"
                    placeholder="DD/MM/YYYY">
            </div>
            <div class="col-md-4">
                <label class="form-label">وقت الحضور الافتراضي</label>
                <input type="time" id="batchCheckIn" class="form-control" value="08:00">
            </div>
            <div class="col-md-4">
                <label class="form-label">وقت الانصراف الافتراضي</label>
                <input type="time" id="batchCheckOut" class="form-control" value="17:00">
            </div>
        </div>

        <!-- The Grid -->
        <div class="table-responsive">
            <table class="table table-bordered table-striped" id="bulkTable">
                <thead class="table-dark text-center">
                    <tr>
                        <th width="5%">#</th>
                        <th width="15%">كود الموظف</th>
                        <th width="25%">الاسم</th>
                        <th width="20%">تاريخ الحضور</th>
                        <th width="17%">وقت الحضور</th>
                        <th width="18%">وقت الانصراف</th>
                        <th width="5%">حذف</th>
                    </tr>
                </thead>
                <tbody id="bulkBody">
                    <!-- Rows generated by JS -->
                </tbody>
            </table>
        </div>

        <div class="d-flex justify-content-end mt-3">
            <button class="btn btn-success btn-lg" onclick="saveAll()">
                <i class="fas fa-save me-1"></i> حفظ الكل
            </button>
        </div>
    </div>
</div>

<script>
    // Initialize
    document.addEventListener('DOMContentLoaded', function () {
        addNewRow(); // Start with one row
    });

    function addNewRow() {
        const tbody = document.getElementById('bulkBody');
        const count = tbody.children.length;
        const rowId = count;

        const batchDate = document.getElementById('batchDate').value;
        const batchCheckIn = document.getElementById('batchCheckIn').value;
        const batchCheckOut = document.getElementById('batchCheckOut').value;

        const row = document.createElement('tr');
        row.innerHTML = `
            <td class="text-center align-middle">${count + 1}</td>
            <td>
                <input type="text" class="form-control emp-code" 
                       onchange="fetchName(this, ${rowId})" 
                       onkeydown="handleEnter(event, this, 'date', ${rowId})"
                       placeholder="الكود وانتر" autofocus>
                <input type="hidden" class="emp-id">
            </td>
            <td>
                <input type="text" class="form-control bg-light emp-name" readonly tabindex="-1">
            </td>
            <td>
                <input type="text" class="form-control date-string att-date" value="${batchDate}"
                       onkeydown="handleEnter(event, this, 'checkin', ${rowId})">
            </td>
            <td>
                <input type="time" class="form-control checkin" value="${batchCheckIn}"
                       onkeydown="handleEnter(event, this, 'checkout', ${rowId})">
            </td>
            <td>
                <input type="time" class="form-control checkout" value="${batchCheckOut}"
                       onkeydown="handleLastEnter(event, ${rowId})">
            </td>
            <td class="text-center">
                <button class="btn btn-danger btn-sm" onclick="this.closest('tr').remove(); updateRowNumbers();" tabindex="-1">
                    <i class="fas fa-times"></i>
                </button>
            </td>
        `;
        tbody.appendChild(row);

        // Focus the code input of new row
        setTimeout(() => row.querySelector('.emp-code').focus(), 50);
    }

    function updateRowNumbers() {
        const tbody = document.getElementById('bulkBody');
        Array.from(tbody.children).forEach((row, idx) => {
            row.children[0].textContent = idx + 1;
        });
    }

    function validateNoFutureDate(dateStr) {
        if (!dateStr) return true;
        const today = new Date();
        today.setHours(0, 0, 0, 0);

        let inputDate = null;
        if (dateStr.includes('/')) {
            const parts = dateStr.split('/');
            if (parts.length === 3) {
                inputDate = new Date(parts[2], parts[1] - 1, parts[0]);
            }
        } else if (dateStr.includes('-')) {
            inputDate = new Date(dateStr);
        }

        if (!inputDate) return true;
        inputDate.setHours(0, 0, 0, 0);
        return inputDate <= today;
    }

    function saveAll() {
        const rows = document.querySelectorAll('#bulkBody tr');
        const payload = [];
        const batchDate = document.getElementById('batchDate').value;
        let hasErrors = false;

        if (!validateNoFutureDate(batchDate)) {
            alert('غير مسموح باختيار تاريخ مستقبلي');
            document.getElementById('batchDate').classList.add('is-invalid');
            document.getElementById('batchDate').focus();
            return;
        }
        document.getElementById('batchDate').classList.remove('is-invalid');

        rows.forEach(row => {
            const id = row.querySelector('.emp-id').value;
            const attDate = row.querySelector('.att-date').value;
            const checkin = row.querySelector('.checkin').value;
            const checkout = row.querySelector('.checkout').value;

            if (!validateNoFutureDate(attDate)) {
                row.querySelector('.att-date').classList.add('is-invalid');
                hasErrors = true;
            } else {
                row.querySelector('.att-date').classList.remove('is-invalid');
            }

            if (id && attDate && checkin) {
                payload.push({
                    employee_id: id,
                    date: attDate,
                    check_in: checkin,
                    check_out: checkout || null
                });
            } else if (row.querySelector('.emp-code').value && !id) {
                row.querySelector('.emp-code').classList.add('is-invalid');
                hasErrors = true;
            }
        });

        if (hasErrors) {
            alert('يرجى تصحيح الأخطاء أو التواريخ المستقبلية');
            return;
        }

        if (payload.length === 0) {
            alert('لا توجد بيانات للحفظ');
            return;
        }

        if (!confirm(`سيتم حفظ ${payload.length} سجل حضور. هل أنت متأكد؟`)) return;

        fetch('{{ url_for("attendance.bulk_save") }}', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token() }}'
            },
            body: JSON.stringify({ records: payload })
        })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    alert('تم الحفظ بنجاح!');
                    window.location.href = "{{ url_for('attendance.daily') }}";
                } else {
                    alert('خطأ: ' + data.message);
                }
            })
            .catch(err => {
                alert('حدث خطأ في الاتصال');
                console.error(err);
            });
    }

    // Handle Enter key navigation with validation
    function handleEnter(e, current, nextClass, rowId) {
        if (e.key === 'Enter') {
            e.preventDefault();
            const row = current.closest('tr');

            if (!current.value || (current.value.trim && !current.value.trim())) {
                current.classList.add('is-invalid');
                current.focus();
                return;
            }

            current.classList.remove('is-invalid');
            current.classList.add('is-valid');

            const nextInput = row.querySelector('.' + nextClass);
            if (nextInput) nextInput.focus();
        }
    }

    function handleLastEnter(e, rowId) {
        if (e.key === 'Enter') {
            e.preventDefault();
            const currentRow = e.target.closest('tr');

            const empId = currentRow.querySelector('.emp-id').value;
            const attDate = currentRow.querySelector('.att-date').value;
            const checkin = currentRow.querySelector('.checkin').value;

            if (!empId) {
                alert('يرجى اختيار موظف أولاً');
                currentRow.querySelector('.emp-code').focus();
                return;
            }

            if (!attDate) {
                alert('يرجى إدخال تاريخ الحضور');
                currentRow.querySelector('.att-date').focus();
                return;
            }

            if (!checkin) {
                alert('يرجى إدخال وقت الحضور');
                currentRow.querySelector('.checkin').focus();
                return;
            }

            if (!validateNoFutureDate(attDate)) {
                alert('غير مسموح باختيار تاريخ مستقبلي');
                currentRow.querySelector('.att-date').focus();
                return;
            }

            e.target.classList.remove('is-invalid');
            e.target.classList.add('is-valid');

            const tbody = document.getElementById('bulkBody');
            const isLastRow = currentRow === tbody.lastElementChild;

            if (isLastRow) {
                addNewRow();
            } else {
                const nextRow = currentRow.nextElementSibling;
                if (nextRow) {
                    nextRow.querySelector('.emp-code').focus();
                }
            }
        }
    }

    function fetchName(input, rowId) {
        const code = input.value.trim();
        const row = input.closest('tr');
        const nameInput = row.querySelector('.emp-name');
        const idInput = row.querySelector('.emp-id');
        const attDateInput = row.querySelector('.att-date');

        if (!code) {
            nameInput.value = '';
            idInput.value = '';
            return;
        }

        /* 1. Check for duplicates in the current grid (Disabled for bulk flexibility)
        const allCodes = Array.from(document.querySelectorAll('.emp-code'))
            .filter(inp => inp !== input)
            .map(inp => inp.value.trim());

        if (allCodes.includes(code)) {
            alert('هذا الموظف مضاف بالفعل في الجدول');
            input.value = '';
            nameInput.value = '';
            idInput.value = '';
            input.focus();
            return;
        }
        */

        fetch(`/employees/check_code/${code}`)
            .then(res => res.json())
            .then(data => {
                if (data.found) {
                    nameInput.value = data.name;
                    idInput.value = data.id;
                    nameInput.classList.add('is-valid');
                    nameInput.classList.remove('is-invalid');
                    
                    // 2. Check for duplicates in the database (Disabled for bulk flexibility)
                    /*
                    const checkDate = attDateInput.value;
                    if (checkDate) {
                        fetch(`{{ url_for('attendance.check_duplicate') }}?employee_id=${data.id}&date=${checkDate}`)
                            .then(res => res.json())
                            .then(dupData => {
                                if (dupData.exists) {
                                    alert(`تنبيه: الموظف لديه سجل حضور بالفعل بتاريخ ${checkDate}`);
                                }
                                attDateInput.focus();
                            });
                    } else {
                        attDateInput.focus();
                    }
                    */
                    attDateInput.focus();
                } else {
                    nameInput.value = 'غير موجود أو لا يعمل';
                    idInput.value = '';
                    nameInput.classList.add('is-invalid');
                    nameInput.classList.remove('is-valid');
                    input.select();
                }
            })
            .catch(err => console.error(err));
    }
</script>
{% endblock %}
