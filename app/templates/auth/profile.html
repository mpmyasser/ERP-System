{% extends "base.html" %}

{% block content %}
<div class="row mb-4">
    <div class="col-md-12">
        <h2 class="fw-bold"><i class="fas fa-user-circle text-primary me-2"></i> الملف الشخصي</h2>
        <p class="text-muted">قم بتحديث بيانات الدخول الخاصة بك وكلمة المرور.</p>
    </div>
</div>

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white py-3">
                <h5 class="mb-0 fw-bold">بيانات المستخدم</h5>
            </div>
            <div class="card-body p-4">
                <form action="{{ url_for('auth.profile') }}" method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="row mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">اسم المستخدم (Login Name)</label>
                            <input type="text" name="username" class="form-control" value="{{ user.username }}"
                                required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">الاسم الكامل</label>
                            <input type="text" name="full_name" class="form-control" value="{{ user.full_name or '' }}"
                                required>
                        </div>
                    </div>

                    <hr class="my-4 opacity-25">

                    <h6 class="fw-bold text-danger mb-3"><i class="fas fa-key me-1"></i> تغيير كلمة المرور (اتركها فارغة
                        إذا لم ترد التغيير)</h6>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">كلمة المرور الجديدة</label>
                            <input type="password" name="new_password" class="form-control" placeholder="........">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">تأكيد كلمة المرور</label>
                            <input type="password" name="confirm_password" class="form-control" placeholder="........">
                        </div>
                    </div>

                    <div class="mt-4 text-start">
                        <button type="submit" class="btn btn-primary px-5">حفظ التغييرات</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
