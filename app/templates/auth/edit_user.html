{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">تعديل بيانات المستخدم: {{ user.username }}</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="mb-3">
                        <label class="form-label">اسم المستخدم (Login Name)</label>
                        <input type="text" name="username" class="form-control" value="{{ user.username }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">الاسم الكامل</label>
                        <input type="text" name="full_name" class="form-control" value="{{ user.full_name }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">كلمة المرور الجديدة (اتركها فارغة إذا لم تكن تريد التغيير)</label>
                        <input type="password" name="password" class="form-control">
                    </div>

                    <div class="mb-3 form-check">
                        <input type="checkbox" name="is_admin" class="form-check-input" id="is_admin" {% if
                            user.is_admin %}checked{% endif %}>
                        <label class="form-check-label" for="is_admin">مدير نظام (Admin)</label>
                    </div>

                    <div class="mb-3 form-check">
                        <input type="checkbox" name="is_active" class="form-check-input" id="is_active" {% if
                            user.is_active %}checked{% endif %}>
                        <label class="form-check-label" for="is_active">نشط (Active)</label>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-success">حفظ التغييرات</button>
                        <a href="{{ url_for('auth.list_users') }}" class="btn btn-secondary">إلغاء</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
