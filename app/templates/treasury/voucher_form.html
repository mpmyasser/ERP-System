{% extends "base.html" %}

{% block content %}
<div class="row mb-3">
    <div class="col-md-12">
        <h3>إنشاء سند {{ 'قبض' if type == 'receipt' else 'صرف' }} جديد</h3>
    </div>
</div>

<div class="row justify-content-center">
    <div class="col-md-10">
        <div class="card shadow-sm border-0">
            <div class="card-body">
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="row mb-4">
                        <div class="col-md-4">
                            <label class="form-label fw-bold">التاريخ</label>
                            <input type="date" name="date" class="form-control"
                                value="{{ date.today().strftime('%Y-%m-%d') }}" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">الخزينة / البنك</label>
                            <select name="treasury_acc_id" id="treasury_acc_id" class="form-select select2-basic"
                                required>
                                <optgroup label="خزائن">
                                    {% for c in cash_accounts %}
                                    <option value="cash_{{ c.id }}" {% if selected_cash and selected_cash.id == c.id %}selected{% endif %}>{{ c.name }}</option>
                                    {% endfor %}
                                </optgroup>
                                <optgroup label="بنوك">
                                    {% for b in bank_accounts %}
                                    <option value="bank_{{ b.id }}">{{ b.bank_name }}</option>
                                    {% endfor %}
                                </optgroup>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">المبلغ</label>
                            <input type="number" step="0.01" name="amount"
                                class="form-control form-control-lg text-primary fw-bold" required>
                        </div>
                    </div>

                    <div class="row mb-4">
                        <div class="col-md-12">
                            <label class="form-label fw-bold">الحساب المقابل (طرف {{ 'المدين' if type == 'payment' else
                                'الدائن' }})</label>
                            <select name="other_account_id" id="other_account_id" class="form-select" required>
                                <option value="">ابحث عن اسم أو كود الحساب...</option>
                            </select>
                            <div class="form-text">الحساب الذي سيتم {{ 'صرف المبلغ إليه' if type == 'payment' else
                                'استلام المبلغ منه' }}.</div>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">البيان / الوصف</label>
                        <textarea name="description" class="form-control" rows="3" required
                            placeholder="مثلاً: سداد فاتورة رقم..."></textarea>
                    </div>

                    <div class="text-center">
                        <button type="submit"
                            class="btn btn-{{ 'success' if type == 'receipt' else 'danger' }} btn-lg px-5">
                            <i class="fas fa-save"></i> حفظ السند وترحيله
                        </button>
                        <a href="{{ url_for('treasury.dashboard') }}" class="btn btn-outline-secondary btn-lg">إلغاء</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% block extra_js %}
<script>
    $(document).ready(function () {
        // Basic Select2 for Treasury (Cash/Bank)
        $('.select2-basic').select2({
            theme: 'bootstrap-5',
            dir: "rtl"
        });

        // Smart AJAX Select2 for Other Account
        $('#other_account_id').select2({
            theme: 'bootstrap-5',
            ajax: {
                url: "{{ url_for('accounting.search_accounts') }}",
                dataType: 'json',
                delay: 250,
                data: function (params) {
                    return {
                        q: params.term
                    };
                },
                processResults: function (data) {
                    return {
                        results: data
                    };
                },
                cache: true
            },
            placeholder: 'ابحث عن اسم أو كود الحساب...',
            minimumInputLength: 1,
            language: {
                inputTooShort: function () {
                    return "يرجى إدخال حرف واحد أو أكثر للبحث";
                },
                searching: function () {
                    return "جاري البحث...";
                },
                noResults: function () {
                    return "لا توجد نتائج";
                }
            },
            dir: "rtl"
        });
    });
</script>
{% endblock %}
{% endblock %}
