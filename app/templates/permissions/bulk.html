{% extends "base.html" %}

{% block title %}إدخال جماعي - التصاريح{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header bg-info text-white d-flex justify-content-between align-items-center">
        <h4 class="mb-0"><i class="fas fa-clock me-2"></i> إدخال جماعي - التصاريح (Bulk Entry)</h4>
        <a href="{{ url_for('permissions.list') }}" class="btn btn-light btn-sm text-info fw-bold">
            <i class="fas fa-list me-1"></i> قائمة التصاريح
        </a>
    </div>
    <div class="card-body">

        <!-- Batch Settings -->
        <div class="row mb-4 p-3 bg-light border rounded">
            <div class="col-md-12 mb-2"><strong><i class="fas fa-cogs me-1"></i> إعدادات الدفعة (افتراضيات)</strong>
            </div>
            <div class="col-md-3">
                <label class="form-label">التاريخ</label>
                <input type="text" id="batchDate" class="form-control date-string" value="{{ today }}"
                    placeholder="DD/MM/YYYY">
            </div>
            <div class="col-md-3">
                <label class="form-label">من الساعة</label>
                <input type="time" id="batchFromTime" class="form-control" value="09:00">
            </div>
            <div class="col-md-3">
                <label class="form-label">إلى الساعة</label>
                <input type="time" id="batchToTime" class="form-control" value="10:00">
            </div>
            <div class="col-md-3">
                <label class="form-label">مدفوع؟</label>
                <select id="batchIsPaid" class="form-select">
                    <option value="false">لا</option>
                    <option value="true">نعم</option>
                </select>
            </div>
        </div>

        <!-- The Grid -->
        <div class="table-responsive">
            <table class="table table-bordered table-striped" id="bulkTable">
                <thead class="table-dark text-center">
                    <tr>
                        <th width="5%">#</th>
                        <th width="10%">كود الموظف</th>
                        <th width="18%">الاسم</th>
                        <th width="12%">التاريخ</th>
                        <th width="10%">من</th>
                        <th width="10%">إلى</th>
                        <th width="8%">مدفوع</th>
                        <th width="17%">السبب</th>
                        <th width="5%">حذف</th>
                    </tr>
                </thead>
                <tbody id="bulkBody">
                    <!-- Rows generated by JS -->
                </tbody>
            </table>
        </div>

        <div class="d-flex justify-content-end mt-3">
            <button class="btn btn-success btn-lg" onclick="saveAll()">
                <i class="fas fa-save me-1"></i> حفظ الكل
            </button>
        </div>
    </div>
</div>

<script>
    // Initialize
    document.addEventListener('DOMContentLoaded', function () {
        loadSettings();
        addNewRow();

        // Save settings on change
        document.getElementById('batchDate').addEventListener('change', saveSettings);
        document.getElementById('batchFromTime').addEventListener('change', saveSettings);
        document.getElementById('batchToTime').addEventListener('change', saveSettings);
        document.getElementById('batchIsPaid').addEventListener('change', saveSettings);
    });


    function saveSettings() {
        const settings = {
            date: document.getElementById('batchDate').value,
            fromTime: document.getElementById('batchFromTime').value,
            toTime: document.getElementById('batchToTime').value,
            isPaid: document.getElementById('batchIsPaid').value
        };

        window.HRSettingsUtil.setObject('permissions_bulk_settings', settings);
    }

    function loadSettings() {
        const settings = window.HRSettingsUtil.getObject('permissions_bulk_settings', null);
        if (settings) {
            if (settings.date) document.getElementById('batchDate').value = settings.date;
            if (settings.fromTime) document.getElementById('batchFromTime').value = settings.fromTime;
            if (settings.toTime) document.getElementById('batchToTime').value = settings.toTime;
            if (settings.isPaid) document.getElementById('batchIsPaid').value = settings.isPaid;
        }
    }

    function addNewRow() {
        const tbody = document.getElementById('bulkBody');
        const count = tbody.children.length;
        const rowId = count;

        const batchDate = document.getElementById('batchDate').value;
        const batchFromTime = document.getElementById('batchFromTime').value;
        const batchToTime = document.getElementById('batchToTime').value;
        const batchIsPaid = document.getElementById('batchIsPaid').value;

        const row = document.createElement('tr');
        row.innerHTML = `
            <td class="text-center align-middle">${count + 1}</td>
            <td>
                <input type="text" class="form-control emp-code" 
                       onchange="fetchName(this, ${rowId})" 
                       onkeydown="handleEnter(event, this, 'row-date', ${rowId})"
                       placeholder="الكود وانتر" autofocus>
                <input type="hidden" class="emp-id">
            </td>
            <td>
                <input type="text" class="form-control bg-light emp-name" readonly tabindex="-1">
            </td>
            <td>
                <input type="text" class="form-control date-string row-date" value="${batchDate}" 
                       placeholder="DD/MM/YYYY" onkeydown="handleEnter(event, this, 'from-time', ${rowId})">
            </td>
            <td>
                <input type="time" class="form-control from-time" value="${batchFromTime}"
                       onkeydown="handleEnter(event, this, 'to-time', ${rowId})">
            </td>
            <td>
                <input type="time" class="form-control to-time" value="${batchToTime}"
                       onkeydown="handleEnter(event, this, 'paid', ${rowId})">
            </td>
            <td>
                <select class="form-select paid" onkeydown="handleEnter(event, this, 'reason', ${rowId})">
                    <option value="false" ${batchIsPaid === 'false' ? 'selected' : ''}>لا</option>
                    <option value="true" ${batchIsPaid === 'true' ? 'selected' : ''}>نعم</option>
                </select>
            </td>
            <td>
                <input type="text" class="form-control reason" placeholder="السبب"
                       onkeydown="handleLastEnter(event, ${rowId})">
            </td>
            <td class="text-center">
                <button class="btn btn-danger btn-sm" onclick="this.closest('tr').remove(); updateRowNumbers();" tabindex="-1">
                    <i class="fas fa-times"></i>
                </button>
            </td>
        `;
        tbody.appendChild(row);

        setTimeout(() => row.querySelector('.emp-code').focus(), 50);
    }

    function handleEnter(e, current, nextClass, rowId) {
        if (e.key === 'Enter') {
            e.preventDefault();
            const row = current.closest('tr');

            if (!current.value || (current.value.trim && !current.value.trim())) {
                current.classList.add('is-invalid');
                current.focus();
                return;
            }

            current.classList.remove('is-invalid');
            current.classList.add('is-valid');

            const nextInput = row.querySelector('.' + nextClass);
            if (nextInput) nextInput.focus();
        }
    }

    function handleLastEnter(e, rowId) {
        if (e.key === 'Enter') {
            e.preventDefault();
            const currentRow = e.target.closest('tr');

            const empId = currentRow.querySelector('.emp-id').value;
            const rowDate = currentRow.querySelector('.row-date').value;
            const fromTime = currentRow.querySelector('.from-time').value;
            const toTime = currentRow.querySelector('.to-time').value;

            if (!empId) {
                alert('يرجى اختيار موظف أولاً');
                currentRow.querySelector('.emp-code').focus();
                return;
            }

            if (!validateNoFutureDate(rowDate)) {
                alert('غير مسموح باختيار تاريخ مستقبلي');
                currentRow.querySelector('.row-date').focus();
                return;
            }

            if (!fromTime || !toTime) {
                alert('يرجى إدخال الوقت');
                currentRow.querySelector('.from-time').focus();
                return;
            }

            e.target.classList.remove('is-invalid');
            e.target.classList.add('is-valid');

            const tbody = document.getElementById('bulkBody');
            const isLastRow = currentRow === tbody.lastElementChild;

            if (isLastRow) {
                addNewRow();
            } else {
                const nextRow = currentRow.nextElementSibling;
                if (nextRow) {
                    nextRow.querySelector('.emp-code').focus();
                }
            }
        }
    }

    function fetchName(input, rowId) {
        const code = input.value.trim();
        const row = input.closest('tr');
        const nameInput = row.querySelector('.emp-name');
        const idInput = row.querySelector('.emp-id');

        if (!code) {
            nameInput.value = '';
            idInput.value = '';
            return;
        }

        // Check if code is duplicated in the current grid
        const allCodeInputs = document.querySelectorAll('.emp-code');
        let duplicateInGrid = false;
        allCodeInputs.forEach(otherInput => {
            if (otherInput !== input && otherInput.value.trim() === code && code !== "") {
                duplicateInGrid = true;
            }
        });

        if (duplicateInGrid) {
            alert(`كود الموظف (${code}) مكرر في الجدول!`);
            nameInput.value = 'كود مكرر في الجدول';
            idInput.value = '';
            input.classList.add('is-invalid');
            nameInput.classList.add('is-invalid');
            input.focus();
            return;
        }

        fetch(`/employees/check_code/${code}`)
            .then(res => res.json())
            .then(data => {
                if (data.found) {
                    nameInput.value = data.name;
                    idInput.value = data.id;
                    
                    // Check for duplicate permission on this date
                    const rowDate = row.querySelector('.row-date').value;
                    if (rowDate) {
                        fetch(`/permissions/check_duplicate?employee_id=${data.id}&date=${rowDate}`)
                            .then(res => res.json())
                            .then(dupData => {
                                if (dupData.exists) {
                                    nameInput.value = `${data.name} (يوجد تصريح بالفعل لهذا التاريخ!)`;
                                    nameInput.classList.add('is-invalid');
                                    nameInput.classList.remove('is-valid');
                                    input.classList.add('is-invalid');
                                } else {
                                    nameInput.classList.add('is-valid');
                                    nameInput.classList.remove('is-invalid');
                                    input.classList.remove('is-invalid');
                                    input.classList.add('is-valid');
                                }
                            });
                    } else {
                        nameInput.classList.add('is-valid');
                        nameInput.classList.remove('is-invalid');
                    }
                    row.querySelector('.row-date').focus();
                } else {
                    nameInput.value = 'غير موجود أو لا يعمل';
                    idInput.value = '';
                    nameInput.classList.add('is-invalid');
                    nameInput.classList.remove('is-valid');
                    input.select();
                }
            })
            .catch(err => console.error(err));
    }

    function updateRowNumbers() {
        const tbody = document.getElementById('bulkBody');
        Array.from(tbody.children).forEach((row, idx) => {
            row.children[0].textContent = idx + 1;
        });
    }

    function validateNoFutureDate(dateStr) {
        if (!dateStr) return true;
        const today = new Date();
        today.setHours(0, 0, 0, 0);

        let inputDate = null;
        if (dateStr.includes('/')) {
            const parts = dateStr.split('/');
            if (parts.length === 3) {
                inputDate = new Date(parts[2], parts[1] - 1, parts[0]);
            }
        } else if (dateStr.includes('-')) {
            inputDate = new Date(dateStr);
        }

        if (!inputDate) return true;
        inputDate.setHours(0, 0, 0, 0);
        return inputDate <= today;
    }

    function saveAll() {
        const rows = document.querySelectorAll('#bulkBody tr');
        const payload = [];
        const batchDate = document.getElementById('batchDate').value;
        let hasErrors = false;

        if (!validateNoFutureDate(batchDate)) {
            alert('غير مسموح باختيار تاريخ مستقبلي');
            document.getElementById('batchDate').classList.add('is-invalid');
            document.getElementById('batchDate').focus();
            return;
        }
        document.getElementById('batchDate').classList.remove('is-invalid');

        rows.forEach(row => {
            const id = row.querySelector('.emp-id').value;
            const rowDate = row.querySelector('.row-date').value;
            const fromTime = row.querySelector('.from-time').value;
            const toTime = row.querySelector('.to-time').value;
            const isPaid = row.querySelector('.paid').value === 'true';
            const reason = row.querySelector('.reason').value;

            if (!validateNoFutureDate(rowDate)) {
                row.querySelector('.row-date').classList.add('is-invalid');
                hasErrors = true;
            } else {
                row.querySelector('.row-date').classList.remove('is-invalid');
            }

            if (id && fromTime && toTime) {
                payload.push({
                    employee_id: id,
                    date: rowDate,
                    from_time: fromTime,
                    to_time: toTime,
                    is_paid: isPaid,
                    reason: reason
                });
            } else if (row.querySelector('.emp-code').value && !id) {
                row.querySelector('.emp-code').classList.add('is-invalid');
                hasErrors = true;
            }
        });

        if (hasErrors) {
            alert('يرجى تصحيح الأخطاء أو التواريخ المستقبلية');
            return;
        }

        if (payload.length === 0) {
            alert('لا توجد بيانات للحفظ');
            return;
        }

        if (!confirm(`سيتم حفظ ${payload.length} تصريح. هل أنت متأكد؟`)) return;

        fetch('{{ url_for("permissions.bulk_save") }}', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token() }}'
            },
            body: JSON.stringify({ entries: payload })
        })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    alert('تم الحفظ بنجاح!');
                    window.location.href = "{{ url_for('permissions.list') }}";
                } else {
                    alert('خطأ: ' + (data.error || data.message));
                }
            })
            .catch(err => {
                alert('حدث خطأ في الاتصال');
                console.error(err);
            });
    }
</script>
{% endblock %}
