{% extends "base.html" %}

{% block title %}تعديل تصاريح جماعي{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header bg-warning text-dark d-flex justify-content-between align-items-center">
        <h4 class="mb-0"><i class="fas fa-edit me-2"></i> تعديل تصاريح جماعي (Bulk Edit)</h4>
        <a href="{{ url_for('permissions.list') }}" class="btn btn-light btn-sm text-dark fw-bold">
            <i class="fas fa-list me-1"></i> قائمة التصاريح
        </a>
    </div>
    <div class="card-body">

        <!-- Filter Section -->
        <div class="row mb-4 p-3 bg-light border rounded">
            <div class="col-md-12 mb-2"><strong><i class="fas fa-filter me-1"></i> تحميل التصاريح للتعديل</strong></div>
            <div class="col-md-3">
                <label class="form-label">من تاريخ</label>
                <input type="text" id="filterDateFrom" class="form-control date-string" placeholder="DD/MM/YYYY">
            </div>
            <div class="col-md-3">
                <label class="form-label">إلى تاريخ</label>
                <input type="text" id="filterDateTo" class="form-control date-string" placeholder="DD/MM/YYYY">
            </div>
            <div class="col-md-3">
                <label class="form-label">القسم</label>
                <select id="filterDepartment" class="form-select">
                    <option value="">الكل</option>
                    {% for dept in departments %}
                    <option value="{{ dept.id }}">{{ dept.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-3 align-self-end">
                <button class="btn btn-primary w-100" onclick="loadPermissions()">
                    <i class="fas fa-download me-1"></i> تحميل التصاريح
                </button>
            </div>
        </div>

        <!-- The Grid -->
        <div class="table-responsive">
            <table class="table table-bordered table-striped" id="bulkEditTable">
                <thead class="table-dark text-center">
                    <tr>
                        <th width="3%"><input type="checkbox" id="selectAll" onchange="toggleSelectAll()"></th>
                        <th width="5%">#</th>
                        <th width="12%">كود الموظف</th>
                        <th width="18%">الاسم</th>
                        <th width="11%">التاريخ</th>
                        <th width="9%">من</th>
                        <th width="9%">إلى</th>
                        <th width="8%">مدفوع</th>
                        <th width="15%">السبب</th>
                    </tr>
                </thead>
                <tbody id="bulkEditBody">
                    <tr>
                        <td colspan="9" class="text-center text-muted">
                            <i class="fas fa-info-circle me-2"></i>استخدم الفلاتر أعلاه لتحميل التصاريح المراد تعديلها
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="d-flex justify-content-between mt-3">
            <div>
                <span class="badge bg-secondary" id="selectedCount">0 محدد</span>
                <span class="badge bg-info ms-2" id="totalCount">0 إجمالي</span>
            </div>
            <button class="btn btn-success btn-lg" onclick="saveChanges()" id="saveBtn" disabled>
                <i class="fas fa-save me-1"></i> حفظ التعديلات
            </button>
        </div>
    </div>
</div>

<style>
    #bulkEditTable {
        color: #000 !important;
    }

    #bulkEditTable input,
    #bulkEditTable select {
        color: #000 !important;
    }

    #bulkEditTable td,
    #bulkEditTable th {
        color: #000 !important;
    }
</style>

<script>
    let permissionsData = [];

    document.addEventListener('DOMContentLoaded', function () {
        // Initialize date pickers if needed
    });

    function loadPermissions() {
        const dateFrom = document.getElementById('filterDateFrom').value;
        const dateTo = document.getElementById('filterDateTo').value;
        const deptId = document.getElementById('filterDepartment').value;

        let url = '/permissions/bulk_edit/load?';
        const params = [];

        if (dateFrom) params.push(`date_from=${dateFrom}`);
        if (dateTo) params.push(`date_to=${dateTo}`);
        if (deptId) params.push(`department_id=${deptId}`);

        url += params.join('&');

        console.log('Loading permissions from:', url);

        fetch(url)
            .then(res => res.json())
            .then(data => {
                console.log('Response:', data);
                if (data.success) {
                    permissionsData = data.permissions;
                    renderPermissions();
                    document.getElementById('saveBtn').disabled = false;
                } else {
                    alert('خطأ: ' + data.message);
                }
            })
            .catch(err => {
                alert('حدث خطأ في الاتصال');
                console.error(err);
            });
    }

    function renderPermissions() {
        const tbody = document.getElementById('bulkEditBody');
        tbody.innerHTML = '';

        if (permissionsData.length === 0) {
            tbody.innerHTML = '<tr><td colspan="9" class="text-center text-muted">لا توجد تصاريح</td></tr>';
            document.getElementById('totalCount').textContent = '0 إجمالي';
            return;
        }

        permissionsData.forEach((perm, index) => {
            const row = document.createElement('tr');
            row.innerHTML = `
            <td class="text-center align-middle">
                <input type="checkbox" class="permission-checkbox" data-index="${index}" onchange="updateSelectedCount()">
            </td>
            <td class="text-center align-middle">${index + 1}</td>
            <td class="align-middle">${perm.employee_code}</td>
            <td class="align-middle">${perm.employee_name}</td>
            <td>
                <input type="text" class="form-control form-control-sm date-string" 
                       value="${perm.date || ''}" placeholder="DD/MM/YYYY"
                       onchange="updatePermission(${index}, 'date', this.value)">
            </td>
            <td>
                <input type="time" class="form-control form-control-sm" 
                       value="${perm.from_time || '00:00'}" 
                       onchange="updatePermission(${index}, 'from_time', this.value)">
            </td>
            <td>
                <input type="time" class="form-control form-control-sm" 
                       value="${perm.to_time || '00:00'}" 
                       onchange="updatePermission(${index}, 'to_time', this.value)">
            </td>
            <td>
                <select class="form-select form-select-sm" 
                        onchange="updatePermission(${index}, 'is_paid', this.value)">
                    <option value="false" ${!perm.is_paid ? 'selected' : ''}>لا</option>
                    <option value="true" ${perm.is_paid ? 'selected' : ''}>نعم</option>
                </select>
            </td>
            <td>
                <input type="text" class="form-control form-control-sm" 
                       value="${perm.reason || ''}" 
                       onchange="updatePermission(${index}, 'reason', this.value)">
            </td>
        `;
            tbody.appendChild(row);
        });

        document.getElementById('totalCount').textContent = `${permissionsData.length} إجمالي`;
        updateSelectedCount();
    }

    function updatePermission(index, field, value) {
        permissionsData[index][field] = value;
        permissionsData[index].modified = true;
    }

    function toggleSelectAll() {
        const selectAll = document.getElementById('selectAll').checked;
        document.querySelectorAll('.permission-checkbox').forEach(cb => {
            cb.checked = selectAll;
        });
        updateSelectedCount();
    }

    function updateSelectedCount() {
        const selected = document.querySelectorAll('.permission-checkbox:checked').length;
        document.getElementById('selectedCount').textContent = `${selected} محدد`;
    }

    function saveChanges() {
        const checkboxes = document.querySelectorAll('.permission-checkbox:checked');

        if (checkboxes.length === 0) {
            alert('يرجى تحديد التصاريح المراد تعديلها');
            return;
        }

        const selectedPermissions = [];
        checkboxes.forEach(cb => {
            const index = parseInt(cb.dataset.index);
            selectedPermissions.push(permissionsData[index]);
        });

        if (!confirm(`سيتم تعديل ${selectedPermissions.length} تصريح. هل أنت متأكد؟`)) return;

        fetch('{{ url_for("permissions.bulk_edit_save") }}', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token() }}'
            },
            body: JSON.stringify({ permissions: selectedPermissions })
        })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    const msg = data.message || `تم تعديل ${data.updated} تصريح بنجاح!`;
                    if (typeof showCenteredFlash === 'function') {
                        showCenteredFlash(msg, 'center');
                        setTimeout(() => window.location.href = "{{ url_for('permissions.list') }}", 900);
                    } else {
                        alert(`تم تعديل ${data.updated} تصريح بنجاح!`);
                        window.location.href = "{{ url_for('permissions.list') }}";
                    }
                } else {
                    alert('خطأ: ' + data.message);
                }
            })
            .catch(err => {
                alert('حدث خطأ في الاتصال');
                console.error(err);
            });
    }
</script>

<script src="{{ url_for('static', filename='js/date_format.js') }}"></script>
{% endblock %}
