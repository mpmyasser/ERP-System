{% extends 'base.html' %}
{% block title %}فاتورة مبيعات جديدة{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="card shadow">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <h4 class="mb-0"><i class="fas fa-file-invoice-dollar"></i> فاتورة مبيعات جديدة</h4>
            <a href="{{ url_for('commercial.sync_products') }}" class="btn btn-light btn-sm">
                <i class="fas fa-sync-alt text-primary"></i> جلب منتجات التشغيل
            </a>
        </div>
        <div class="card-body">
            <form method="POST" action="{{ url_for('commercial.new_sale') }}" id="salesForm">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                
                <div class="row mb-4">
                    <div class="col-md-4">
                        <label class="form-label fw-bold">العميل</label>
                        <select name="partner_id" class="form-select" required>
                            <option value="">-- اختر العميل --</option>
                            {% for p in partners %}
                            <option value="{{ p.id }}">{{ p.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">نوع المبيعات</label>
                        <select name="sale_type" class="form-select">
                            <option value="Sales">مبيعات معرض</option>
                            <option value="POS">مبيعات قسم القص</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">المخزن</label>
                        <select name="warehouse_id" class="form-select" required>
                            <option value="">-- اختر المخزن --</option>
                            {% for w in warehouses %}
                            <option value="{{ w.id }}">{{ w.name }} ({{ w.type }})</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <h5 class="border-bottom pb-2 mb-3 text-secondary">تفاصيل الفاتورة</h5>
                
                <div class="table-responsive">
                    <table class="table table-bordered" id="itemsTable">
                        <thead class="table-light">
                            <tr>
                                <th>الصنف</th>
                                <th width="150">الكمية</th>
                                <th width="150">السعر</th>
                                <th width="150">الإجمالي</th>
                                <th width="50"></th>
                            </tr>
                        </thead>
                        <tbody id="itemsBody">
                            <!-- Template Row -->
                            <tr class="item-row">
                                <td>
                                    <select name="product_id[]" class="form-select product-select" required>
                                        <option value="">-- اختر الصنف --</option>
                                        {% for p in products %}
                                        <option value="{{ p.id }}" data-price="{{ p.sale_price }}">{{ p.name }} - متوفر: {{ p.current_stock }}</option>
                                        {% endfor %}
                                    </select>
                                </td>
                                <td><input type="number" name="qty[]" class="form-control qty-input" min="1" step="0.01" required></td>
                                <td><input type="number" name="price[]" class="form-control price-input" min="0" step="0.01" required></td>
                                <td><input type="text" class="form-control row-total bg-light fw-bold" readonly></td>
                                <td>
                                    <button type="button" class="btn btn-sm btn-outline-danger remove-row"><i class="fas fa-times"></i></button>
                                </td>
                            </tr>
                        </tbody>
                        <tfoot>
                            <tr>
                                <td colspan="3" class="text-end fw-bold">الإجمالي الكلي:</td>
                                <td class="fw-bold text-success fs-5"><span id="grandTotal">0.00</span></td>
                                <td></td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
                
                <div class="mb-3">
                    <button type="button" class="btn btn-sm btn-secondary" id="addRow"><i class="fas fa-plus"></i> إضافة سطر</button>
                </div>

                <div class="d-flex justify-content-end mt-4 pt-3 border-top">
                    <a href="{{ url_for('commercial.sales_dashboard') }}" class="btn btn-light me-2">إلغاء</a>
                    <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> حفظ وترحيل المحاسبة</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const tbody = document.getElementById('itemsBody');
    const templateRow = tbody.querySelector('tr').cloneNode(true);
    
    // Clear values in template
    templateRow.querySelector('select').value = '';
    templateRow.querySelectorAll('input').forEach(i => i.value = '');
    
    function calculateTotals() {
        let grandTotal = 0;
        document.querySelectorAll('.item-row').forEach(row => {
            const qty = parseFloat(row.querySelector('.qty-input').value) || 0;
            const price = parseFloat(row.querySelector('.price-input').value) || 0;
            const rowTotal = qty * price;
            
            row.querySelector('.row-total').value = rowTotal.toFixed(2);
            grandTotal += rowTotal;
        });
        
        document.getElementById('grandTotal').textContent = grandTotal.toFixed(2);
    }
    
    function attachListeners(row) {
        row.querySelector('.product-select').addEventListener('change', function(e) {
            const option = e.target.options[e.target.selectedIndex];
            if(option.value) {
                row.querySelector('.price-input').value = option.dataset.price || 0;
                calculateTotals();
            }
        });
        
        row.querySelector('.qty-input').addEventListener('input', calculateTotals);
        row.querySelector('.price-input').addEventListener('input', calculateTotals);
        
        row.querySelector('.remove-row').addEventListener('click', function() {
            if(document.querySelectorAll('.item-row').length > 1) {
                row.remove();
                calculateTotals();
            }
        });
    }
    
    // Attach to initial row
    attachListeners(tbody.querySelector('tr'));
    
    document.getElementById('addRow').addEventListener('click', function() {
        const newRow = templateRow.cloneNode(true);
        attachListeners(newRow);
        tbody.appendChild(newRow);
    });
});
</script>
{% endblock %}
