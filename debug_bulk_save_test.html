<!doctype html>
<html lang="ar">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="csrf-token" content="TEST_CSRF_TOKEN_123" />
    <title>Debug Bulk Save Test</title>
    <style>
        body { font-family: Arial, sans-serif; direction: rtl; padding: 20px; }
        .box { border:1px solid #ddd; padding:12px; margin-bottom:12px; }
        button { padding:8px 12px; font-size:1rem }
        #results { white-space:pre-wrap; background:#f8f9fa; padding:12px; border-radius:6px; }
    </style>
</head>
<body>
    <h3>اختبار تشخيصي لزر "حفظ التغييرات"</h3>

    <div class="box">
        <form id="testForm" method="POST" action="/employees/bulk_salaries_save">
            <!-- Minimal form similar to original page -->
            <input type="hidden" name="csrf_token" value="TEST_CSRF_TOKEN_123">

            <div style="margin-bottom:8px;">
                <label><input id="toggleInterfere" type="checkbox"> تفعيل مستمع متعمد يقطع الحدث (simulate preventDefault + stopImmediatePropagation)</label>
            </div>

            <button id="save-all-btn" class="btn btn-success"> <i></i> حفظ التغييرات</button>
        </form>
    </div>

    <div class="box">
        <strong>نتائج التشخيص (Console + هنا)</strong>
        <div id="results">جارٍ التشغيل...</div>
    </div>

<script>
(function () {
    const resultsEl = document.getElementById('results');
    function log(msg) {
        console.log(msg);
        resultsEl.textContent += msg + "\n";
    }

    // Instrumentation flags
    window.__diag = {
        clickCapturedByDocumentCapture: false,
        clickCapturedByButtonCapture: false,
        clickCapturedByButtonBubble: false,
        defaultPreventedAtCapture: null,
        defaultPreventedAtBubble: null,
        formSubmitCalled: false,
        fetchCalled: false,
        fetchArgs: null
    };

    // 1) Override form.submit to detect programmatic submit
    const testForm = document.getElementById('testForm');
    testForm._origSubmit = testForm.submit;
    testForm.submit = function () {
        window.__diag.formSubmitCalled = true;
        log('INSTRUMENT: form.submit() was called programmatically');
        // Do NOT actually submit (prevent navigation) - we are only diagnosing
    };

    // 2) Mock fetch to capture network attempts
    window._origFetch = window.fetch;
    window.fetch = function () {
        window.__diag.fetchCalled = true;
        window.__diag.fetchArgs = arguments;
        log('INSTRUMENT: fetch was called with args: ' + JSON.stringify([].slice.call(arguments).map(a => (typeof a === 'string'? a : '[object]'))));
        return Promise.resolve({ ok: true, json: () => Promise.resolve({ success: true }) });
    };

    // 3) Capture-phase listener on document (first to run for clicks)
    document.addEventListener('click', function (e) {
        if (e.target && e.target.id === 'save-all-btn') {
            window.__diag.clickCapturedByDocumentCapture = true;
            window.__diag.defaultPreventedAtCapture = e.defaultPrevented;
            log('CAPTURE: document capture saw click. defaultPrevented=' + e.defaultPrevented);
        }
    }, true);

    // 4) Capture-phase listener on the button itself
    const saveBtn = document.getElementById('save-all-btn');
    saveBtn.addEventListener('click', function (e) {
        window.__diag.clickCapturedByButtonCapture = true;
        window.__diag.defaultPreventedAtCapture = e.defaultPrevented;
        log('CAPTURE: button capture saw click. defaultPrevented=' + e.defaultPrevented);
    }, true);

    // 5) Bubble-phase listener on the button (simulating the "real" handler)
    saveBtn.addEventListener('click', function (e) {
        window.__diag.clickCapturedByButtonBubble = true;
        window.__diag.defaultPreventedAtBubble = e.defaultPrevented;
        log('BUBBLE: button bubble handler executing. defaultPrevented=' + e.defaultPrevented);

        // Simulate the expected save logic used in the real app: try fetch, and also form.submit fallback
        try {
            // Attempt fetch (AJAX save)
            const csrf = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || document.querySelector('input[name="csrf_token"]')?.value || null;
            fetch('/employees/bulk_salaries_save', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrf }, body: JSON.stringify({ test: true }) });
            log('BUBBLE: triggered fetch() (AJAX)');
        } catch (err) {
            log('BUBBLE: fetch threw: ' + err);
        }

        // Also try form.submit as a fallback
        try {
            testForm.submit();
            log('BUBBLE: attempted testForm.submit()');
        } catch (err) {
            log('BUBBLE: form.submit() threw: ' + err);
        }

    }, false);

    // 6) A global listener that may intentionally interfere (can be toggled)
    let interferingListener = function (e) {
        if (e.target && e.target.id === 'save-all-btn') {
            e.preventDefault();
            // stopImmediatePropagation prevents any subsequently-added listeners in the same phase
            e.stopImmediatePropagation();
            log('INTERFERER: called preventDefault() and stopImmediatePropagation()');
        }
    };

    document.getElementById('toggleInterfere').addEventListener('change', function (ev) {
        if (this.checked) {
            document.addEventListener('click', interferingListener);
            log('INTERFERER: enabled');
        } else {
            document.removeEventListener('click', interferingListener);
            log('INTERFERER: disabled');
        }
    });

    // 7) Auto-run tests: run twice (without and with interferer) and report
    function runOneTest(label, enableInterferer) {
        return new Promise(resolve => {
            // reset flags
            window.__diag.clickCapturedByDocumentCapture = false;
            window.__diag.clickCapturedByButtonCapture = false;
            window.__diag.clickCapturedByButtonBubble = false;
            window.__diag.defaultPreventedAtCapture = null;
            window.__diag.defaultPreventedAtBubble = null;
            window.__diag.formSubmitCalled = false;
            window.__diag.fetchCalled = false;
            window.__diag.fetchArgs = null;

            // set interferer
            if (enableInterferer) {
                document.addEventListener('click', interferingListener);
            }

            log('---- RUN: ' + label + ' (interferer=' + enableInterferer + ') ----');

            // Dispatch a real click event
            setTimeout(() => {
                const evt = new MouseEvent('click', { bubbles: true, cancelable: true });
                saveBtn.dispatchEvent(evt);

                // Wait a tick for async handlers (fetch mock) to run
                setTimeout(() => {
                    log('STEP 1: click event dispatched');
                    log('STEP 2: document capture saw click? ' + window.__diag.clickCapturedByDocumentCapture);
                    log('STEP 3: button capture saw click? ' + window.__diag.clickCapturedByButtonCapture);
                    log('STEP 4: button bubble saw click? ' + window.__diag.clickCapturedByButtonBubble);
                    log('STEP 5: defaultPrevented at capture? ' + window.__diag.defaultPreventedAtCapture);
                    log('STEP 6: defaultPrevented at bubble? ' + window.__diag.defaultPreventedAtBubble);
                    log('STEP 7: form.submit called? ' + window.__diag.formSubmitCalled);
                    log('STEP 8: fetch called? ' + window.__diag.fetchCalled + (window.__diag.fetchArgs ? ' args:' + JSON.stringify([].slice.call(window.__diag.fetchArgs).map(a => (typeof a === 'string'? a : '[object]'))) : ''));

                    if (enableInterferer) document.removeEventListener('click', interferingListener);
                    log('---- END RUN: ' + label + ' ----\n');
                    resolve();
                }, 100);
            }, 50);
        });
    }

    async function autoRunAll() {
        resultsEl.textContent = '';
        // 1) Run baseline (no interference)
        await runOneTest('Baseline', false);
        // 2) Run with simulated interference
        document.getElementById('toggleInterfere').checked = true;
        await runOneTest('With Interferer', true);
        document.getElementById('toggleInterfere').checked = false;

        // Final suggestion line
        log('DIAG: Finished auto-run. Use above STEP logs to see which phase failed.');
    }

    // Run automatically when page loads
    window.addEventListener('load', function () {
        setTimeout(autoRunAll, 200);
    });

})();
</script>
</body>
</html>
